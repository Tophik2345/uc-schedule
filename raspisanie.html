<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Расписание УЦ · ФСБ</title>
<style>
  :root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:#101214}
  .wrap{max-width:640px;margin:0 auto;padding:22px 14px 64px}
  .kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}
  h1{margin:0 0 8px;font-size:22px;font-weight:700}
  .stamp{margin:0 0 14px;color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin:0 0 12px}
  .tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui}
  .tab.on{background:var(--accent);border-color:var(--accent)}
  .empty,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .empty{padding:22px;color:var(--muted);text-align:center}
  .card{padding:12px 13px;margin:0 0 8px;border-left:3px solid var(--accent)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .type{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .time{font-size:24px;font-weight:800;margin:2px 0 0}
  .state{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d7dadd;background:#22272b;border-radius:6px;padding:4px 7px}
  .state.gather{background:#2b2620;color:#d9c7a4}
  .state.live{background:#1d2a24;color:#b7d2c3}
  .title{font-size:17px;font-weight:700;margin:8px 0 2px}
  .who,.meta{margin:0;color:var(--muted);font-size:13px}
  .note{margin:8px 0 0;padding:8px 9px;background:#121516;border-radius:7px;color:#c9ced2;font-size:13px}
  .shot{margin-top:8px;width:100%;border-radius:8px;display:block}
  .sorts{display:none;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .sorts.show{display:flex}
  .day{margin:16px 0 8px;color:#9aa0a6;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">ФСБ · Академия · Управление УЦ</p>
  <h1>Расписание</h1>
  <p class="stamp" id="stamp">сборка 3.0 · время Москва</p>
  <div class="tabs">
    <button class="tab on" data-tab="now">Сейчас</button>
    <button class="tab" data-tab="done">Пройденные</button>
  </div>
  <div class="sorts" id="sorts">
    <button class="tab on" data-sort="new">Сначала новые</button>
    <button class="tab" data-sort="old">Сначала старые</button>
  </div>
  <div id="list"></div>
</div>
<script>
let TAB="now", SORT="new", EVENTS=[], UPDATED="";
function dayTitle(iso){
  if(!iso) return "Без даты";
  const [y,m,d]=iso.split("-");
  const months=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  return Number(d)+" "+(months[Number(m)-1]||m)+" "+y;
}
const TYPE={lecture:"Лекция",training:"Тренировка",exam:"Экзамен",patrol:"Патруль"};
function mskNow(){
  const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const p=Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:p.year+"-"+p.month+"-"+p.day, hm:p.hour+":"+p.minute};
}
function parseEvents(data){
  const doc=Array.isArray(data)?(data[0]||{}):data||{};
  let ev=doc.events||[];
  if(!ev.length && Array.isArray(data) && data[0] && data[0].title) ev=data;
  return {updated:doc.updated||"", events:Array.isArray(ev)?ev.filter(x=>x&&(x.id||x.title)):[]};
}
function evEnd(ev){
  if(ev.end) return ev.end;
  const base=ev.start||ev.gather;
  if(!base) return "";
  const mins=Number(ev.duration)||45;
  const [h,m]=base.split(":").map(Number);
  const t=(h*60+(m||0)+mins)%(24*60);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function status(ev,now){
  if(ev.done) return "done";
  if(ev.date && ev.date<now.date) return "done";
  if(ev.date && ev.date>now.date) return "soon";
  const start=ev.start||ev.gather||"00:00";
  const gather=ev.gather||ev.start||"00:00";
  const end=evEnd(ev);
  if(end && now.hm>=end) return "done";
  if(now.hm>=start) return "live";
  if(now.hm>=gather) return "gather";
  return "soon";
}
function label(st){return {soon:"Скоро",gather:"Сбор",live:"Идёт",done:"Пройдено"}[st]||""}
function card(ev,now){
  const st=status(ev,now);
  return `<article class="card">
    <div class="top">
      <div><div class="type">${TYPE[ev.type]||"Событие"}</div><div class="time">${ev.gather||ev.start||"--:--"}${evEnd(ev)?"–"+evEnd(ev):""}</div></div>
      <div class="state ${st}">${label(st)}</div>
    </div>
    <div class="title">${ev.title||""}</div>
    <p class="who">Проводит ${ev.instructor||"—"}</p>
    <p class="meta">${ev.place?ev.place+" · ":""}${ev.date||""} · ${ev.gather||"—"}–${evEnd(ev)||"—"} · начало ${ev.start||"—"}</p>
    ${ev.note?`<div class="note">${ev.note}</div>`:""}
    ${ev.photo?`<img class="shot" src="${ev.photo}" alt="">`:""}
  </article>`;
}
function render(){
  const now=mskNow(), cur=[], past=[];
  EVENTS.forEach(ev => (status(ev,now)==="done"?past:cur).push(ev));
  const sorts=document.getElementById("sorts");
  if(sorts) sorts.classList.toggle("show", TAB==="done");
  let list=TAB==="now"?cur:past;
  const key=ev=>(ev.date||"")+(ev.start||ev.gather||"");
  list=list.slice().sort((a,b)=>TAB==="done"&&SORT==="new"?key(b).localeCompare(key(a)):key(a).localeCompare(key(b)));
  const stamp=document.getElementById("stamp");
  if(stamp) stamp.textContent="сборка 3.0 · Москва "+now.hm+(UPDATED?" · база "+UPDATED.slice(0,16).replace("T"," "):"")+" · занятий "+EVENTS.length;
  if(!list.length){
    document.getElementById("list").innerHTML=`<div class="empty">${TAB==="now"?"Сейчас ничего не стоит.":"Пройденных пока нет."}</div>`;
    return;
  }
  if(TAB!=="done"){
    document.getElementById("list").innerHTML=list.map(ev=>card(ev,now)).join("");
    return;
  }
  const days=[];
  list.forEach(ev=>{
    const d=ev.date||"";
    if(!days.length||days[days.length-1].date!==d) days.push({date:d,items:[]});
    days[days.length-1].items.push(ev);
  });
  document.getElementById("list").innerHTML=days.map(g=>`<div class="day">${dayTitle(g.date)}</div>`+g.items.map(ev=>card(ev,now)).join("")).join("");
}
async function load(){
  const stamp=Date.now();
  const urls=[
    "https://raw.githubusercontent.com/Tophik2345/uc-schedule/main/schedule.json?t="+stamp,
    "https://tophik2345.github.io/uc-schedule/schedule.json?t="+stamp
  ];
  let best=null;
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) continue;
      const parsed=parseEvents(await r.json());
      if(!parsed.events.length) continue;
      if(!best || String(parsed.updated||"")>String(best.updated||"")) best=parsed;
    }catch(e){}
  }
  if(best){
    EVENTS=best.events;
    UPDATED=best.updated;
  }
  render();
}
document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick=()=>{
    if(btn.dataset.tab){
      TAB=btn.dataset.tab;
      document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===btn));
    }
    if(btn.dataset.sort){
      SORT=btn.dataset.sort;
      document.querySelectorAll("[data-sort]").forEach(x=>x.classList.toggle("on",x===btn));
    }
    render();
  };
});
load();
setInterval(load,10000);
</script>
</body>
</html>
