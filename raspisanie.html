<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
<title>Расписание УЦ · ФСБ</title>
<style>
:root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}.wrap{max-width:640px;margin:0 auto;padding:22px 14px 64px}.kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}h1{margin:0 0 8px;font-size:22px}.stamp{margin:0 0 14px;color:var(--muted);font-size:12px}.tabs,.sorts{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.sorts{display:none}.sorts.show{display:flex}.tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui}.tab.on{background:var(--accent);border-color:var(--accent)}.empty,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.empty{padding:22px;color:var(--muted);text-align:center}.card{padding:12px 13px;margin:0 0 8px;border-left:3px solid var(--accent)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.type{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}.time{font-size:24px;font-weight:800;margin:2px 0}.state{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#22272b;border-radius:6px;padding:4px 7px}.state.gather{background:#2b2620;color:#d9c7a4}.state.live{background:#1d2a24;color:#b7d2c3}.title{font-size:17px;font-weight:700;margin:8px 0 2px}.who,.meta{margin:0;color:var(--muted);font-size:13px}.note{margin:8px 0 0;padding:8px 9px;background:#121516;border-radius:7px;color:#c9ced2;font-size:13px}.shot{margin-top:8px;width:100%;border-radius:8px;display:block}.day{margin:16px 0 8px;color:#9aa0a6;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style></head><body><div class="wrap"><p class="kicker">ФСБ · Академия · Управление УЦ</p><h1>Расписание</h1><p class="stamp" id="stamp">сборка 4.0 · Supabase · время Москва</p><div class="tabs"><button class="tab on" data-tab="now">Сейчас</button><button class="tab" data-tab="done">Пройденные</button></div><div class="sorts" id="sorts"><button class="tab on" data-sort="new">Сначала новые</button><button class="tab" data-sort="old">Сначала старые</button></div><div id="list"><div class="empty">Загрузка…</div></div></div>
<script>
const API='https://npeqnqsgcqskjpdjkxcm.supabase.co/functions/v1/uc-api';let TAB='now',SORT='new',EVENTS=[],UPDATED='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayTitle(iso){if(!iso)return'Без даты';const[y,m,d]=iso.split('-'),ms=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return Number(d)+' '+(ms[Number(m)-1]||m)+' '+y}const TYPE={lecture:'Лекция',training:'Тренировка',exam:'Экзамен',patrol:'Патруль'};
function mskNow(){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}),p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:p.year+'-'+p.month+'-'+p.day,hm:p.hour+':'+p.minute}}
function parseEvents(data){const d=Array.isArray(data)?(data[0]||{}):(data||{});return{updated:d.updated||'',events:Array.isArray(d.events)?d.events.filter(x=>x&&(x.id||x.title)):[]}}
function evEnd(e){if(e.end)return e.end;const b=e.start||e.gather;if(!b)return'';const[h,m]=b.split(':').map(Number),t=(h*60+(m||0)+(Number(e.duration)||45))%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function status(e,n){if(e.done||e.cancelled)return'done';if(e.date<n.date)return'done';if(e.date>n.date)return'soon';const s=e.start||e.gather||'00:00',g=e.gather||e.start||'00:00',end=evEnd(e);if(end&&n.hm>=end)return'done';if(n.hm>=s)return'live';if(n.hm>=g)return'gather';return'soon'}function label(s){return{soon:'Скоро',gather:'Сбор',live:'Идёт',done:'Пройдено'}[s]||''}
function card(e,n){const st=status(e,n),photo=e.photo&&/^https:\/\//i.test(e.photo)?`<img class="shot" src="${esc(e.photo)}" alt="">`:'';return`<article class="card"><div class="top"><div><div class="type">${esc(TYPE[e.type]||'Событие')}</div><div class="time">${esc(e.gather||e.start||'--:--')}${evEnd(e)?'–'+esc(evEnd(e)):''}</div></div><div class="state ${st}">${label(st)}</div></div><div class="title">${esc(e.title||'')}</div><p class="who">Проводит ${esc(e.instructor||'—')}</p><p class="meta">${e.place?esc(e.place)+' · ':''}${esc(e.date||'')} · ${esc(e.gather||'—')}–${esc(evEnd(e)||'—')} · начало ${esc(e.start||'—')}</p>${e.note?`<div class="note">${esc(e.note)}</div>`:''}${photo}</article>`}
function render(){const n=mskNow(),cur=[],past=[];EVENTS.forEach(e=>(status(e,n)==='done'?past:cur).push(e));document.getElementById('sorts').classList.toggle('show',TAB==='done');let a=TAB==='now'?cur:past,k=e=>(e.date||'')+(e.start||e.gather||'');a=a.slice().sort((x,y)=>TAB==='done'&&SORT==='new'?k(y).localeCompare(k(x)):k(x).localeCompare(k(y)));document.getElementById('stamp').textContent='сборка 4.0 · Supabase · Москва '+n.hm+(UPDATED?' · база '+UPDATED.slice(0,16).replace('T',' '):'')+' · занятий '+EVENTS.length;if(!a.length){document.getElementById('list').innerHTML=`<div class="empty">${TAB==='now'?'Сейчас ничего не стоит.':'Пройденных пока нет.'}</div>`;return}if(TAB!=='done'){document.getElementById('list').innerHTML=a.map(e=>card(e,n)).join('');return}const ds=[];a.forEach(e=>{if(!ds.length||ds.at(-1).date!==(e.date||''))ds.push({date:e.date||'',items:[]});ds.at(-1).items.push(e)});document.getElementById('list').innerHTML=ds.map(g=>`<div class="day">${dayTitle(g.date)}</div>`+g.items.map(e=>card(e,n)).join('')).join('')}
async function load(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public',input:{}}),cache:'no-store'}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'HTTP '+r.status);const p=parseEvents(j);EVENTS=p.events;UPDATED=p.updated;render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">Не удалось загрузить расписание. Попробуйте обновить страницу.</div>';document.getElementById('stamp').textContent='сборка 4.0 · ошибка связи с сервером'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab){TAB=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b))}if(b.dataset.sort){SORT=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('on',x===b))}render()});load();setInterval(load,10000);
</script></body></html>
