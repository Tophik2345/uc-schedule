<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Инструктор · Расписание УЦ</title>
<style>
  :root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:#101214}
  .wrap{max-width:640px;margin:0 auto;padding:22px 14px 64px}
  .gate{max-width:420px;margin:8vh auto;padding:0 14px}
  .kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}
  h1{margin:0 0 14px;font-size:22px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 10px}
  label{display:block;margin:8px 0 5px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  input,select,textarea{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:14px system-ui}
  input[readonly]{opacity:.75}
  textarea{min-height:58px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{border:0;border-radius:8px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;background:var(--accent);color:#f3e6c4}
  button.ghost{background:#1c2024;color:var(--text);border:1px solid var(--line)}
  button.danger{background:#4a151c;color:#f3e6c4}
  .hint{margin:8px 0 0;color:var(--muted);font-size:12px}
  .who{margin:0 0 12px;color:#c9ced2;font-size:13px}
  .item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item b{display:block}
  .item span{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin:0 0 10px}
  .tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui}
  .tab.on{background:var(--accent);border-color:var(--accent)}
  .drop{border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:13px;background:#121516}
  .prev{max-width:100%;max-height:180px;display:block;margin:8px auto 0;border-radius:8px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <p class="kicker">Только инструкторам</p>
  <h1>Вход</h1>
  <div class="tabs">
    <button class="tab on" type="button" data-mode="login">Войти</button>
    <button class="tab" type="button" data-mode="reg">Регистрация</button>
  </div>
  <div class="panel" id="loginBox">
    <label>Логин</label>
    <input id="login" placeholder="login" autocomplete="username">
    <label>Пароль</label>
    <input id="pass" type="password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:#c9ced2;margin-top:12px">
      <input id="remember" type="checkbox" checked style="width:auto">
      Запомнить вход на этом компьютере
    </label>
    <div class="btns"><button type="button" id="enter">Войти</button></div>
  </div>
  <div class="panel" id="regBox" hidden>
    <label>Спецпароль для регистрации</label>
    <input id="regpin" type="password" placeholder="его даёт старший состава">
    <label>Фамилия</label>
    <input id="rlast" placeholder="Яров">
    <label>Имя</label>
    <input id="rfirst" placeholder="Ренат">
    <label>Логин</label>
    <input id="rlogin" placeholder="yarov">
    <label>Пароль</label>
    <input id="rpass" type="password">
    <div class="btns"><button type="button" id="reg">Зарегистрироваться</button></div>
    <p class="hint">Без спецпароля зарегистрироваться нельзя.</p>
  </div>
</div>
<div id="app" class="wrap" hidden>
  <p class="kicker">ФСБ · Академия · Управление УЦ</p>
  <h1>Поставить занятие</h1>
  <p class="who" id="hello"></p>
  <form class="panel" id="f">
    <label>Тип</label>
    <select id="type">
      <option value="lecture">Лекция</option>
      <option value="training">Тренировка</option>
      <option value="exam">Экзамен</option>
      <option value="patrol">Патруль</option>
    </select>
    <label>Название</label>
    <input id="title" placeholder="УК+ПК" required>
    <label>Кто проводит</label>
    <input id="instructor" readonly>
    <label>Место сбора</label>
    <select id="place">
      <option selected>Лекционная 1</option>
      <option>Лекционная 2</option>
      <option>Академия</option>
      <option>Лубянка</option>
      <option>База</option>
      <option>Форт</option>
      <option>Полигон</option>
    </select>
    <label>Дата</label>
    <input id="date" type="date" required>
    <div class="grid">
      <div><label>Сбор</label><input id="gather" type="time" required></div>
      <div><label>Начало</label><input id="start" type="time" required></div>
    </div>
    <label>Комментарий</label>
    <textarea id="note" placeholder="Форма строевая"></textarea>
    <label>Скрин места / ориентир</label>
    <div class="drop">Ctrl+V вставь скрин или выбери файл
      <div class="btns" style="justify-content:center"><button type="button" class="ghost" id="pick">Выбрать изображение</button></div>
      <input id="file" type="file" accept="image/*" hidden>
      <img id="prev" class="prev" hidden>
    </div>
    <label>Токен (один раз, в личку от старшего)</label>
    <input id="ghtoken" type="password" placeholder="вставь и забудь">
    <div class="btns">
      <button type="submit">Добавить</button>
      <button type="button" class="ghost" id="out">Выйти</button>
    </div>
    <p class="hint" id="status">Токен вставляется один раз. Потом только сбор, начало и «Добавить».</p>
  </form>
  <div id="list"></div>
</div>
<script>
const SALT="uc-fsb-schedule-2026";
const REG_HASH="f33c767b47c57af1afbb1f2da150ff7a228e76e22cb12a6d6a3a36e25416f6e2";
const GH={owner:"Tophik2345",repo:"uc-schedule",path:"schedule.json",branch:"main"};
let EVENTS=[], USER="", PHOTO="";
function setStatus(t){document.getElementById("status").textContent=t}
function token(){return (localStorage.getItem("uc_gh_token")||document.getElementById("ghtoken").value||"").trim()}
function saveToken(){
  const el=document.getElementById("ghtoken");
  const v=(el && el.value || "").trim();
  if(v) localStorage.setItem("uc_gh_token",v);
}
function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
async function gh(path, method, body){
  const r=await fetch("https://api.github.com"+path,{
    method,
    headers:{
      Authorization:"Bearer "+token(),
      Accept:"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",
      "Content-Type":"application/json"
    },
    body:body?JSON.stringify(body):undefined
  });
  const raw=await r.text();
  let j={}; try{j=JSON.parse(raw)}catch(e){}
  if(!r.ok) throw new Error(j.message||("GitHub "+r.status));
  return j;
}
async function pullRemote(){
  if(!token()) return;
  const file=await gh(`/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`,"GET");
  const text=decodeURIComponent(escape(atob(file.content.replace(/\n/g,""))));
  const data=JSON.parse(text);
  if(Array.isArray(data.events)) EVENTS=data.events;
  save();
}
async function publish(){
  saveToken();
  if(!token()) throw new Error("нет токена");
  let sha;
  try{
    const cur=await gh(`/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`,"GET");
    sha=cur.sha;
  }catch(e){}
  await gh(`/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,"PUT",{
    message:"расписание УЦ "+new Date().toISOString().slice(0,16).replace("T"," "),
    content:b64utf8(pack()),
    branch:GH.branch,
    sha
  });
}
async function hashPass(s){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT+"|"+s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function users(){try{return JSON.parse(localStorage.getItem("uc_users")||"[]")}catch(e){return[]}}
function saveUsers(list){localStorage.setItem("uc_users", JSON.stringify(list))}
function load(){try{EVENTS=JSON.parse(localStorage.getItem("uc_schedule")||"{}").events||[]}catch(e){EVENTS=[]}}
function save(){localStorage.setItem("uc_schedule", JSON.stringify({updated:new Date().toISOString(),events:EVENTS}))}
function addMin(time,mins){
  if(!time) return "";
  const [h,m]=time.split(":").map(Number);
  const t=(h*60+(m||0)+mins+24*60)%(24*60);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function pack(){return JSON.stringify({updated:new Date().toISOString(),events:EVENTS},null,2)}
function typeName(t){return {lecture:"Лекция",training:"Тренировка",exam:"Экзамен",patrol:"Патруль"}[t]||t}
function render(){
  const box=document.getElementById("list");
  if(!EVENTS.length){box.innerHTML='<div class="panel">Пока пусто.</div>';return;}
  box.innerHTML=EVENTS.slice().reverse().map(ev=>`
    <div class="panel item">
      <div>
        <b>${ev.gather} · ${typeName(ev.type)} ${ev.title}</b>
        <span>Проводит ${ev.instructor}<br>${ev.place||""} · Сбор ${ev.gather} · Начало ${ev.start}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${ev.done?"":`<button class="ghost" data-done="${ev.id}">Завершить</button>`}
        <button class="danger" data-id="${ev.id}">Удалить</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("button[data-id]").forEach(b=>{
    b.onclick=async()=>{
      EVENTS=EVENTS.filter(x=>x.id!==b.dataset.id);
      save();render();
      if(token()){
        setStatus("Удаляю с сайта...");
        try{await publish();setStatus("Удалено у академии.");}
        catch(err){setStatus("Удалено у тебя. На сайт не ушло: "+err.message);}
      }
    };
  });
  box.querySelectorAll("button[data-done]").forEach(b=>{
    b.onclick=async()=>{
      EVENTS=EVENTS.map(x=>x.id===b.dataset.done?Object.assign({},x,{done:true}):x);
      save();render();
      if(token()){
        setStatus("Закрываю занятие...");
        try{await publish();setStatus("Занятие завершено. У академии в «Пройденные».");}
        catch(err){setStatus("У тебя закрыто. На сайт не ушло: "+err.message);}
      }
    };
  });
}
async function openApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  document.getElementById("instructor").value=USER;
  document.getElementById("hello").textContent="Вы вошли как "+USER;
  document.getElementById("ghtoken").value=localStorage.getItem("uc_gh_token")||"";
  load();render();
  if(token()){
    setStatus("Беру расписание с сайта...");
    try{await pullRemote();render();setStatus("С сайта подтянуто.");}
    catch(err){setStatus("Локально. Сайт: "+err.message);}
  }
}
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1, 900/img.width);
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",0.62));
      URL.revokeObjectURL(url);
    };
    img.onerror=reject;
    img.src=url;
  });
}
async function setPhoto(file){
  if(!file || !file.type.startsWith("image/")) return;
  PHOTO=await compress(file);
  const prev=document.getElementById("prev");
  prev.src=PHOTO; prev.hidden=false;
}
document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===btn));
    document.getElementById("loginBox").hidden=btn.dataset.mode!=="login";
    document.getElementById("regBox").hidden=btn.dataset.mode!=="reg";
  };
});
document.getElementById("pick").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>setPhoto(e.target.files[0]);
document.addEventListener("paste",e=>{
  const item=[...e.clipboardData.items].find(x=>x.type.startsWith("image/"));
  if(item) setPhoto(item.getAsFile());
});
document.getElementById("login").value=localStorage.getItem("uc_login")||"";
(function(){
  const until=Number(localStorage.getItem("uc_until")||0);
  if(localStorage.getItem("uc_remember")==="1" && localStorage.getItem("uc_user") && Date.now()<until){
    USER=localStorage.getItem("uc_user");
    openApp();
  } else if(until && Date.now()>=until){
    localStorage.removeItem("uc_remember");
    localStorage.removeItem("uc_user");
    localStorage.removeItem("uc_until");
  }
})();
document.getElementById("reg").onclick=async ()=>{
  if(await hashPass(document.getElementById("regpin").value.trim())!==REG_HASH){
    alert("Неверный спецпароль"); return;
  }
  const last=document.getElementById("rlast").value.trim();
  const first=document.getElementById("rfirst").value.trim();
  const login=document.getElementById("rlogin").value.trim().toLowerCase();
  const pass=document.getElementById("rpass").value;
  if(!last||!first||!login||pass.length<4){alert("Заполни логин, фамилию, имя и пароль от 4 символов");return;}
  const list=users();
  if(list.some(u=>u.login===login)){alert("Такой логин уже есть");return;}
  list.push({login,last,first,hash:await hashPass(pass)});
  saveUsers(list);
  alert("Готово. Теперь войди логином и паролем.");
  document.querySelector('[data-mode="login"]').click();
  document.getElementById("login").value=login;
};
document.getElementById("enter").onclick=async ()=>{
  const lock=Number(localStorage.getItem("uc_lock")||0);
  if(Date.now()<lock){alert("Слишком много попыток. Подожди 10 минут.");return;}
  const login=document.getElementById("login").value.trim().toLowerCase();
  const pass=document.getElementById("pass").value;
  const u=users().find(x=>x.login===login);
  const h=await hashPass(pass);
  const ok=u && (u.hash?u.hash===h:u.pass===pass);
  if(!ok){
    const n=Number(localStorage.getItem("uc_fail")||0)+1;
    localStorage.setItem("uc_fail", String(n));
    if(n>=5){ localStorage.setItem("uc_lock", String(Date.now()+10*60*1000)); localStorage.setItem("uc_fail","0"); }
    alert("Нет такого логина или пароль неверный");
    return;
  }
  localStorage.setItem("uc_fail","0");
  USER=u.last+" "+u.first;
  localStorage.setItem("uc_login", login);
  localStorage.setItem("uc_user", USER);
  if(document.getElementById("remember").checked){
    localStorage.setItem("uc_remember","1");
    localStorage.setItem("uc_until", String(Date.now()+12*60*60*1000));
  } else {
    localStorage.removeItem("uc_remember");
    localStorage.removeItem("uc_until");
  }
  openApp();
};
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("enter").click()});
document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("out").onclick=()=>{
  localStorage.removeItem("uc_remember");
  localStorage.removeItem("uc_user");
  localStorage.removeItem("uc_until");
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  document.getElementById("pass").value="";
};
document.getElementById("f").onsubmit=e=>{
  e.preventDefault();
  EVENTS.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type:document.getElementById("type").value,
    title:document.getElementById("title").value.trim(),
    instructor:USER,
    place:document.getElementById("place").value,
    date:document.getElementById("date").value,
    gather:document.getElementById("gather").value,
    start:document.getElementById("start").value,
    end:"",
    duration:0,
    done:false,
    note:document.getElementById("note").value.trim(),
    photo:PHOTO||""
  });
  save();render();
  document.getElementById("title").value="";
  document.getElementById("note").value="";
  PHOTO=""; document.getElementById("prev").hidden=true;
  if(token()){
    setStatus("Добавлено. Публикую...");
    publish().then(()=>setStatus("У академии уже есть. Пусть обновят страницу.")).catch(err=>setStatus("У тебя есть. На сайт не ушло: "+err.message));
  } else {
    setStatus("Добавлено только у тебя. Вставь токен GitHub.");
  }
};
document.getElementById("pub").onclick=async()=>{
  setStatus("Публикую...");
  try{await publish();setStatus("Опубликовано.");}
  catch(err){setStatus("Не ушло: "+err.message);}
};
</script>
</body>
</html>
