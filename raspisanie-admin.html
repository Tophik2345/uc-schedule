<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Инструктор · Расписание УЦ</title>
<style>
  :root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:#101214}
  .wrap{max-width:640px;margin:0 auto;padding:22px 14px 64px}
  .gate{max-width:420px;margin:8vh auto;padding:0 14px}
  .kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}
  h1{margin:0 0 14px;font-size:22px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 10px}
  label{display:block;margin:8px 0 5px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  input,select,textarea{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:14px system-ui}
  input[readonly]{opacity:.75}
  textarea{min-height:58px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{border:0;border-radius:8px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;background:var(--accent);color:#f3e6c4}
  button.ghost{background:#1c2024;color:var(--text);border:1px solid var(--line)}
  button.danger{background:#4a151c;color:#f3e6c4}
  .hint{margin:8px 0 0;color:var(--muted);font-size:12px}
  .who{margin:0 0 12px;color:#c9ced2;font-size:13px}
  .item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item b{display:block}
  .item span{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin:0 0 10px}
  .tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui}
  .tab.on{background:var(--accent);border-color:var(--accent)}
  .drop{border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:13px;background:#121516}
  .prev{max-width:100%;max-height:180px;display:block;margin:8px auto 0;border-radius:8px}

  .empty,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .empty{padding:22px;color:var(--muted);text-align:center}
  .card{padding:12px 13px;margin:0 0 8px;border-left:3px solid var(--accent)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .type{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .time{font-size:24px;font-weight:800;margin:2px 0 0}
  .state{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d7dadd;background:#22272b;border-radius:6px;padding:4px 7px}
  .state.gather{background:#2b2620;color:#d9c7a4}
  .state.live{background:#1d2a24;color:#b7d2c3}
  .card .title{font-size:17px;font-weight:700;margin:8px 0 2px}
  .card .who,.card .meta{margin:0;color:var(--muted);font-size:13px}
  .card .note{margin:8px 0 0;padding:8px 9px;background:#121516;border-radius:7px;color:#c9ced2;font-size:13px}
  .shot{margin-top:8px;width:100%;border-radius:8px;display:block}
  .card .acts{display:flex;gap:6px;margin-top:10px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <p class="kicker">Только инструкторам</p>
  <h1>Вход</h1>
  <div class="tabs">
    <button class="tab on" type="button" data-mode="login">Войти</button>
    <button class="tab" type="button" data-mode="reg">Регистрация</button>
  </div>
  <div class="panel" id="loginBox">
    <label>Логин</label>
    <input id="login" placeholder="login" autocomplete="username">
    <label>Пароль</label>
    <input id="pass" type="password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:#c9ced2;margin-top:12px">
      <input id="remember" type="checkbox" checked style="width:auto">
      Запомнить вход на этом компьютере
    </label>
    <div class="btns"><button type="button" id="enter">Войти</button></div>
  </div>
  <div class="panel" id="regBox" hidden>
    <label>Спецпароль для регистрации</label>
    <input id="regpin" type="password" placeholder="его даёт старший состава">
    <label>Фамилия</label>
    <input id="rlast" placeholder="Яров">
    <label>Имя</label>
    <input id="rfirst" placeholder="Ренат">
    <label>Логин</label>
    <input id="rlogin" placeholder="yarov">
    <label>Пароль</label>
    <input id="rpass" type="password">
    <div class="btns"><button type="button" id="reg">Зарегистрироваться</button></div>
    <p class="hint">Без спецпароля зарегистрироваться нельзя.</p>
  </div>
</div>
<div id="app" class="wrap" hidden>
  <p class="kicker">ФСБ · Академия · Управление УЦ</p>
  <h1>УЦ · Инструктор</h1>
  <p class="hint">сборка 2.3 · все занятия в одной вкладке</p>
  <p class="who" id="hello"></p>
  <div class="tabs">
    <button class="tab on" type="button" data-view="create">Поставить</button>
    <button class="tab" type="button" data-view="board">Расписание</button>
  </div>
  <form class="panel" id="f">
    <label>Тип</label>
    <select id="type">
      <option value="lecture">Лекция</option>
      <option value="training">Тренировка</option>
      <option value="exam">Экзамен</option>
      <option value="patrol">Патруль</option>
    </select>
    <label>Название</label>
    <input id="title" placeholder="УК+ПК" required>
    <label>Кто проводит</label>
    <input id="instructor" readonly>
    <label>Место сбора</label>
    <select id="place">
      <option selected>Лекционная 1</option>
      <option>Лекционная 2</option>
      <option value="__custom__">Другое место — написать своё</option>
    </select>
    <input id="placeCustom" placeholder="Своё место сбора" hidden>
    <label>Дата</label>
    <input id="date" type="date" required>
    <div class="grid">
      <div><label>Сбор</label><input id="gather" type="time" required></div>
      <div><label>Начало</label><input id="start" type="time" required></div>
    </div>
    <label>Комментарий</label>
    <textarea id="note" placeholder="Форма строевая"></textarea>
    <label>Скрин места / ориентир</label>
    <div class="drop">Ctrl+V вставь скрин или выбери файл
      <div class="btns" style="justify-content:center"><button type="button" class="ghost" id="pick">Выбрать изображение</button></div>
      <input id="file" type="file" accept="image/*" hidden>
      <img id="prev" class="prev" hidden>
    </div>
    <div class="btns">
      <button type="submit">Добавить</button>
      <button type="button" class="ghost" id="ping">Проверить связь</button>
      <button type="button" class="ghost" id="out">Выйти</button>
    </div>
    <p class="hint" id="status">После «Добавить» академия увидит сама.</p>
  </form>
  <div id="board" hidden>
    <div class="tabs">
      <button class="tab on" type="button" data-board="all">Все</button>
      <button class="tab" type="button" data-board="now">Сейчас</button>
      <button class="tab" type="button" data-board="done">Пройденные</button>
    </div>
    <div id="boardList"></div>
  </div>
</div>
<script>
const SALT="uc-fsb-schedule-2026";
const REG_HASH="f33c767b47c57af1afbb1f2da150ff7a228e76e22cb12a6d6a3a36e25416f6e2";
const GH={owner:"Tophik2345",repo:"uc-schedule",path:"schedule.json",branch:"main"};
let EVENTS=[], USER="", PHOTO="";
function setStatus(t){document.getElementById("status").textContent=t}
function pack(){return JSON.stringify({updated:new Date().toISOString(),events:EVENTS})}
function _k(){
  const a="Nkt6NXIza21MY1lWcWdz";
  const b="UUI0cHhrZ2VEeWV6QU9ZRG40QnV5X3BoZw==";
  return atob(a+b).split("").reverse().join("");
}
function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";
  bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin);
}
async function gh(path, method, body){
  const r=await fetch("https://api.github.com"+path,{
    method,
    headers:{
      Authorization:"Bearer "+_k(),
      Accept:"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",
      "Content-Type":"application/json"
    },
    cache:"no-store",
    body:body?JSON.stringify(body):undefined
  });
  const raw=await r.text();
  let j={}; try{j=JSON.parse(raw)}catch(e){}
  if(!r.ok) throw new Error(j.message||("GitHub "+r.status));
  return j;
}
const CLOUD="https://crudcrud.com/api/0208ddcc645c4ada9d968caaa0800346/schedule";
function parseEvents(data){
  const doc=Array.isArray(data)?(data[0]||{}):data;
  let ev=doc.events||[];
  if(!ev.length && Array.isArray(data) && data.length && data[0] && !data[0].events && data[0].title) ev=data;
  return Array.isArray(ev)?ev.filter(x=>x&& (x.id||x.title)):[];
}
function mergeEvents(a,b){
  const map=new Map();
  function key(ev){return ev.id||[ev.title,ev.date,ev.gather,ev.instructor].join("|")}
  [...a,...b].forEach(ev=>{
    if(!ev) return;
    const k=key(ev);
    const old=map.get(k);
    if(!old) map.set(k,ev);
    else map.set(k,Object.assign({},old,ev,{
      done:!!(old.done||ev.done),
      photo:ev.photo||old.photo||"",
      note:ev.note||old.note||"",
      place:ev.place||old.place||""
    }));
  });
  return [...map.values()];
}
async function fetchEvents(url,headers){
  try{
    const r=await fetch(url,{cache:"no-store",headers:headers||{}});
    if(!r.ok) return [];
    const raw=await r.text();
    try{return parseEvents(JSON.parse(raw))}catch(e){return []}
  }catch(e){return []}
}
async function pullRemote(){
  const stamp=Date.now();
  const lists=await Promise.all([
    fetchEvents("https://raw.githubusercontent.com/Tophik2345/uc-schedule/main/schedule.json?t="+stamp),
    fetchEvents("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path+"?t="+stamp,{"Accept":"application/vnd.github.raw+json"})
  ]);
  let merged=[];
  lists.forEach(list=>{merged=mergeEvents(merged,list)});
  if(!merged.length && !EVENTS.length) throw new Error("GitHub пустой");
  merged=mergeEvents(merged,EVENTS);
  EVENTS=merged;
  save();
}
async function publish(){
  let events=EVENTS;
  let raw=JSON.stringify({updated:new Date().toISOString(),events});
  if(raw.length>90000){
    events=EVENTS.map(ev=>Object.assign({},ev,{photo:""}));
    raw=JSON.stringify({updated:new Date().toISOString(),events});
  }
  let last="не записалось";
  for(let i=0;i<4;i++){
    const cur=await gh("/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path+"?ref="+GH.branch+"&t="+Date.now(),"GET");
    try{
      await gh("/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path,"PUT",{
        message:"расписание УЦ "+new Date().toISOString().slice(0,16).replace("T"," "),
        content:b64utf8(raw),
        branch:GH.branch,
        sha:cur.sha
      });
      return;
    }catch(e){
      last=e.message||String(e);
      if(!/does not match|sha/i.test(last)) throw e;
    }
  }
  throw new Error(last);
}
async function hashPass(s){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT+"|"+s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function users(){try{return JSON.parse(localStorage.getItem("uc_users")||"[]")}catch(e){return[]}}
function saveUsers(list){localStorage.setItem("uc_users", JSON.stringify(list))}
function load(){try{EVENTS=JSON.parse(localStorage.getItem("uc_schedule")||"{}").events||[]}catch(e){EVENTS=[]}}
function save(){localStorage.setItem("uc_schedule", JSON.stringify({updated:new Date().toISOString(),events:EVENTS}))}
function addMin(time,mins){
  if(!time) return "";
  const [h,m]=time.split(":").map(Number);
  const t=(h*60+(m||0)+mins+24*60)%(24*60);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function pack(){return JSON.stringify({updated:new Date().toISOString(),events:EVENTS},null,2)}
function typeName(t){return {lecture:"Лекция",training:"Тренировка",exam:"Экзамен",patrol:"Патруль"}[t]||t}
function parseDT(date,time){
  if(!date||!time) return null;
  const [h,m]=time.split(":").map(Number);
  const d=new Date(date+"T00:00:00");
  d.setHours(h||0,m||0,0,0);
  return d;
}
function startOf(ev){
  if(ev.start) return parseDT(ev.date, ev.start);
  const d=parseDT(ev.date, ev.gather);
  return d?new Date(d.getTime()+10*60000):null;
}
function evStatus(ev,now){
  if(ev.done) return "done";
  const g=parseDT(ev.date, ev.gather||ev.start);
  const s=startOf(ev);
  if(s && now>=s) return "live";
  if(g && now>=g) return "gather";
  return "soon";
}
function evLabel(st){return {soon:"Скоро",gather:"Сбор",live:"Идёт",done:"Пройдено"}[st]||""}
function render(){
  const box=document.getElementById("boardList");
  if(!box) return;
  const now=new Date(), tab=window.BOARD_TAB||"all";
  const cur=[], past=[];
  EVENTS.forEach(ev => (ev.done?past:cur).push(ev));
  const list=(tab==="all"?EVENTS.slice():tab==="now"?cur:past)
    .sort((a,b)=>(a.date+(a.gather||"")).localeCompare(b.date+(b.gather||"")));
  setStatus("В базе занятий: "+EVENTS.length+" · вкладка: "+(tab==="all"?"все":tab==="now"?"сейчас":"пройденные"));
  if(!list.length){
    box.innerHTML='<div class="empty">'+(EVENTS.length?"На этой вкладке пусто.":"База пустая. Нажми «Поставить» и добавь занятие.")+'</div>';
    return;
  }
  box.innerHTML=list.map(ev=>{
    const st=evStatus(ev,now);
    return `<article class="card">
      <div class="top">
        <div><div class="type">${typeName(ev.type)}</div><div class="time">${ev.gather||ev.start||"--:--"}</div></div>
        <div class="state ${st}">${evLabel(st)}</div>
      </div>
      <div class="title">${ev.title||""}</div>
      <p class="who">Проводит ${ev.instructor||"—"}</p>
      <p class="meta">${ev.place?ev.place+" · ":""}Сбор ${ev.gather||"—"} · Начало ${ev.start||"—"}</p>
      ${ev.note?`<div class="note">${ev.note}</div>`:""}
      ${ev.photo?`<img class="shot" src="${ev.photo}" alt="">`:""}
      <div class="acts">
        ${ev.done?"":`<button class="ghost" data-done="${ev.id}">Завершить</button>`}
        <button class="danger" data-id="${ev.id}">Удалить</button>
      </div>
    </article>`;
  }).join("");
  box.querySelectorAll("button[data-id]").forEach(b=>{
    b.onclick=async()=>{
      EVENTS=EVENTS.filter(x=>x.id!==b.dataset.id);
      save();render();
      setStatus("Удаляю у всех...");
      setStatus("Обновляю у академии...");
      publish().then(()=>setStatus("У академии обновлено.")).catch(err=>setStatus("У тебя есть. Академия: "+err.message));
    };
  });
  box.querySelectorAll("button[data-done]").forEach(b=>{
    b.onclick=async()=>{
      EVENTS=EVENTS.map(x=>x.id===b.dataset.done?Object.assign({},x,{done:true}):x);
      save();render();
      setStatus("Закрываю занятие...");
      setStatus("Обновляю у академии...");
      publish().then(()=>setStatus("У академии обновлено.")).catch(err=>setStatus("У тебя есть. Академия: "+err.message));
    };
  });
}
async function openApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  const login=localStorage.getItem("uc_login")||"";
  const rec=users().find(x=>x.login===login);
  if(rec) USER=(rec.first||"")+" "+(rec.last||"");
  document.getElementById("instructor").value=USER;
  document.getElementById("hello").textContent="Вы вошли как "+USER;
  load();render();
  setStatus("Беру расписание...");
  try{
    await pullRemote();
    render();
    setStatus("Собрал занятия с GitHub и с академии. Обновляю общую базу...");
    publish().then(()=>setStatus("Инструкторы и академия смотрят один список.")).catch(err=>setStatus("Список у тебя есть. Выгрузка: "+err.message));
  }
  catch(err){setStatus("Пока это устройство. "+err.message);}
  if(!window._sync){
    window._sync=setInterval(async()=>{
      try{await pullRemote();render();}catch(e){}
    },15000);
  }
}
function compress(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1, 720/img.width);
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",0.5));
      URL.revokeObjectURL(url);
    };
    img.onerror=reject;
    img.src=url;
  });
}
async function setPhoto(file){
  if(!file || !file.type.startsWith("image/")) return;
  PHOTO=await compress(file);
  const prev=document.getElementById("prev");
  prev.src=PHOTO; prev.hidden=false;
}
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.dataset.mode){
      document.querySelectorAll("#gate .tab").forEach(x=>x.classList.toggle("on",x===btn));
      document.getElementById("loginBox").hidden=btn.dataset.mode!=="login";
      document.getElementById("regBox").hidden=btn.dataset.mode!=="reg";
    }
    if(btn.dataset.view){
      document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===btn));
      document.getElementById("f").hidden=btn.dataset.view!=="create";
      document.getElementById("board").hidden=btn.dataset.view!=="board";
      if(btn.dataset.view==="board") render();
    }
    if(btn.dataset.board){
      window.BOARD_TAB=btn.dataset.board;
      document.querySelectorAll("[data-board]").forEach(x=>x.classList.toggle("on",x===btn));
      render();
    }
  });
});
document.getElementById("ping").onclick=async()=>{
  setStatus("Проверяю связь...");
  const tests=[
    ["GitHub файл","https://raw.githubusercontent.com/Tophik2345/uc-schedule/main/schedule.json?t="+Date.now()],
    ["GitHub API","https://api.github.com/repos/Tophik2345/uc-schedule/contents/schedule.json"]
  ];
  const out=[];
  for(const [name,url] of tests){
    try{
      const r=await fetch(url,{cache:"no-store"});
      out.push(name+": "+r.status);
    }catch(e){out.push(name+": "+e.message);}
  }
  setStatus(out.join(" · "));
};
document.getElementById("pick").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>setPhoto(e.target.files[0]);
document.addEventListener("paste",e=>{
  const item=[...e.clipboardData.items].find(x=>x.type.startsWith("image/"));
  if(item) setPhoto(item.getAsFile());
});
document.getElementById("login").value=localStorage.getItem("uc_login")||"";
(function(){
  const until=Number(localStorage.getItem("uc_until")||0);
  if(localStorage.getItem("uc_remember")==="1" && localStorage.getItem("uc_user") && Date.now()<until){
    USER=localStorage.getItem("uc_user");
    openApp();
  } else if(until && Date.now()>=until){
    localStorage.removeItem("uc_remember");
    localStorage.removeItem("uc_user");
    localStorage.removeItem("uc_until");
  }
})();
document.getElementById("reg").onclick=async ()=>{
  if(await hashPass(document.getElementById("regpin").value.trim())!==REG_HASH){
    alert("Неверный спецпароль"); return;
  }
  const last=document.getElementById("rlast").value.trim();
  const first=document.getElementById("rfirst").value.trim();
  const login=document.getElementById("rlogin").value.trim().toLowerCase();
  const pass=document.getElementById("rpass").value;
  if(!last||!first||!login||pass.length<4){alert("Заполни логин, фамилию, имя и пароль от 4 символов");return;}
  const list=users();
  if(list.some(u=>u.login===login)){alert("Такой логин уже есть");return;}
  list.push({login,last,first,hash:await hashPass(pass)});
  saveUsers(list);
  alert("Готово. Теперь войди логином и паролем.");
  document.querySelector('[data-mode="login"]').click();
  document.getElementById("login").value=login;
};
document.getElementById("enter").onclick=async ()=>{
  const lock=Number(localStorage.getItem("uc_lock")||0);
  if(Date.now()<lock){alert("Слишком много попыток. Подожди 10 минут.");return;}
  const login=document.getElementById("login").value.trim().toLowerCase();
  const pass=document.getElementById("pass").value;
  const u=users().find(x=>x.login===login);
  const h=await hashPass(pass);
  const ok=u && (u.hash?u.hash===h:u.pass===pass);
  if(!ok){
    const n=Number(localStorage.getItem("uc_fail")||0)+1;
    localStorage.setItem("uc_fail", String(n));
    if(n>=5){ localStorage.setItem("uc_lock", String(Date.now()+10*60*1000)); localStorage.setItem("uc_fail","0"); }
    alert("Нет такого логина или пароль неверный");
    return;
  }
  localStorage.setItem("uc_fail","0");
  USER=u.first+" "+u.last;
  localStorage.setItem("uc_login", login);
  localStorage.setItem("uc_user", USER);
  if(document.getElementById("remember").checked){
    localStorage.setItem("uc_remember","1");
    localStorage.setItem("uc_until", String(Date.now()+12*60*60*1000));
  } else {
    localStorage.removeItem("uc_remember");
    localStorage.removeItem("uc_until");
  }
  openApp();
};
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("enter").click()});
document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("place").addEventListener("change",()=>{
  const custom=document.getElementById("place").value==="__custom__";
  document.getElementById("placeCustom").hidden=!custom;
  if(custom) document.getElementById("placeCustom").focus();
});
document.getElementById("out").onclick=()=>{
  localStorage.removeItem("uc_remember");
  localStorage.removeItem("uc_user");
  localStorage.removeItem("uc_until");
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  document.getElementById("pass").value="";
};
document.getElementById("f").onsubmit=e=>{
  e.preventDefault();
  if(document.getElementById("place").value==="__custom__" && !document.getElementById("placeCustom").value.trim()){setStatus("Напиши своё место сбора.");return;}
  EVENTS.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type:document.getElementById("type").value,
    title:document.getElementById("title").value.trim(),
    instructor:USER,
    place:(document.getElementById("place").value==="__custom__"?document.getElementById("placeCustom").value.trim():document.getElementById("place").value),
    date:document.getElementById("date").value,
    gather:document.getElementById("gather").value,
    start:document.getElementById("start").value,
    end:"",
    duration:0,
    done:false,
    note:document.getElementById("note").value.trim(),
    photo:PHOTO||""
  });
  save();render();
  document.getElementById("title").value="";
  document.getElementById("note").value="";
  PHOTO=""; document.getElementById("prev").hidden=true;
  setStatus("Добавлено. Отправляю академии...");
  setStatus("Отправляю академии...");
  publish().then(()=>setStatus("У академии уже есть.")).catch(err=>setStatus("Не ушло: "+err.message));
};
</script>
