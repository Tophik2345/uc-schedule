<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Инструктор · Расписание УЦ</title><style>:root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}.wrap{max-width:680px;margin:auto;padding:22px 14px 64px}.gate{max-width:420px;margin:8vh auto;padding:0 14px}.kicker{color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}h1{font-size:22px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 10px}.card{border-left:3px solid var(--accent)}label{display:block;margin:8px 0 5px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}input,select,textarea{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px}textarea{min-height:60px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs,.btns{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}.btns{margin-top:12px}button,.tab{border:1px solid transparent;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;background:var(--accent);color:#f3e6c4}.tab{background:#1c2024;color:var(--text);border-color:var(--line)}.tab.on{background:var(--accent)}button.ghost{background:#1c2024;color:var(--text);border-color:var(--line)}button.danger{background:#4a151c}.hint,.meta{color:var(--muted);font-size:12px}.who{color:#c9ced2}.title{font-size:17px;font-weight:700}.time{font-size:20px;font-weight:800}.empty{padding:20px;text-align:center;color:var(--muted)}.error{color:#e3a7ad}.ok{color:#b7d2c3}a{color:#c9ced2}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>
<div id="gate" class="gate"><p class="kicker">Только инструкторам</p><h1>Вход</h1><div class="tabs"><button class="tab on" data-mode="login">Войти</button><button class="tab" data-mode="reg">Регистрация</button></div><div class="panel" id="loginBox"><label>Логин</label><input id="login" autocomplete="username"><label>Пароль</label><input id="pass" type="password"><label style="text-transform:none"><input id="remember" type="checkbox" checked style="width:auto"> Запомнить вход</label><div class="btns"><button id="enter">Войти</button></div><p id="gateStatus" class="hint"></p></div><div class="panel" id="regBox" hidden><label>Спецпароль регистрации</label><input id="regpin" type="password"><label>Имя</label><input id="rfirst"><label>Фамилия</label><input id="rlast"><label>Логин</label><input id="rlogin"><label>Пароль (минимум 12 символов)</label><input id="rpass" type="password"><div class="btns"><button id="reg">Зарегистрироваться</button></div><p id="regStatus" class="hint"></p></div></div>
<div id="app" class="wrap" hidden><p class="kicker">ФСБ · Академия · Управление УЦ</p><h1>УЦ · Инструктор</h1><p id="hello" class="who"></p><div class="tabs"><button class="tab on" data-view="create">Поставить</button><button class="tab" data-view="board">Расписание</button><button class="tab" data-view="password">Пароль</button><a class="tab" href="povyshenie.html">Повышения</a></div><form id="create" class="panel"><label>Тип</label><select id="type"><option value="lecture">Лекция</option><option value="training">Тренировка</option><option value="exam">Экзамен</option><option value="patrol">Патруль</option></select><label>Название</label><input id="title" required><label>Место сбора</label><input id="place" value="Лекционная 1"><label>Дата</label><input id="date" type="date" required><div class="grid"><div><label>Сбор</label><input id="gather" type="time" required></div><div><label>Начало</label><input id="start" type="time" required></div></div><label>Длительность, минут</label><input id="duration" type="number" min="10" max="300" value="45"><label>Комментарий</label><textarea id="note"></textarea><div class="btns"><button type="submit">Добавить</button><button type="button" class="ghost" id="reload">Обновить</button><button type="button" class="ghost" id="out">Выйти</button></div><p id="status" class="hint">Данные сохраняются через Supabase.</p></form><div id="board" hidden><div id="boardList"><div class="empty">Загрузка…</div></div></div><div id="passwordBox" class="panel" hidden><h1 style="font-size:17px">Смена пароля</h1><label>Текущий пароль</label><input id="currentPass" type="password"><label>Новый пароль (минимум 12 символов)</label><input id="newPass" type="password"><div class="btns"><button id="changePass">Сменить пароль</button></div><p id="passStatus" class="hint"></p></div></div>
<script>const API='https://hpeqnqsgcqskjpdjkxcm.supabase.co/functions/v1/uc-api',STORE='uc-session-v1';let SESSION=null,ME=null,EVENTS=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function device(){let d=localStorage.getItem('uc-device');if(!d){d='DEV-'+crypto.randomUUID();localStorage.setItem('uc-device',d)}return d}function save(){if(!SESSION)return;const a=$('remember').checked?localStorage:sessionStorage,b=$('remember').checked?sessionStorage:localStorage;a.setItem(STORE,JSON.stringify(SESSION));b.removeItem(STORE)}function clear(){localStorage.removeItem(STORE);sessionStorage.removeItem(STORE);SESSION=ME=null}async function api(action,input={},use=true){const h={'Content-Type':'application/json'};if(use&&SESSION?.access_token)h.Authorization='Bearer '+SESSION.access_token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,input}),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Ошибка сервера');return j}async function refresh(){const j=await api('refresh',{refresh_token:SESSION.refresh_token},false);SESSION=j.session;ME=j.me;save()}async function call(a,i={}){try{return await api(a,i)}catch(e){if(/сеанс|войдите/i.test(e.message)&&SESSION?.refresh_token){await refresh();return api(a,i)}throw e}}function gate(m=''){clear();$('app').hidden=true;$('gate').hidden=false;$('gateStatus').textContent=m}function view(v){$('create').hidden=v!=='create';$('board').hidden=v!=='board';$('passwordBox').hidden=v!=='password';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===v));if(v==='board')load()}function app(){if(!ME)return;$('gate').hidden=true;$('app').hidden=false;$('hello').textContent='Вошёл: '+([ME.first,ME.last].filter(Boolean).join(' ')||ME.login||'Инструктор')+(ME.owner?' · хозяин':'');view(ME.mustChangePassword?'password':'create')}function norm(j){const d=Array.isArray(j)?j[0]||{}:j||{};return Array.isArray(d.events)?d.events:[]}async function load(){try{EVENTS=norm(await call('schedule'));draw()}catch(e){$('boardList').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}function draw(){const a=EVENTS.slice().sort((x,y)=>((x.date||'')+(x.start||'')).localeCompare((y.date||'')+(y.start||'')));$('boardList').innerHTML=a.length?a.map(e=>`<div class="card"><div class="time">${esc(e.date||'')} · ${esc(e.gather||e.start||'--:--')}</div><div class="title">${esc(e.title||'Занятие')}</div><div class="meta">${esc(e.place||'—')} · ${esc(e.instructor||'—')}${e.done?' · завершено':''}${e.cancelled?' · отменено':''}</div><div class="btns">${!e.done&&!e.cancelled?`<button class="ghost" onclick="act('event.done','${esc(e.id)}')">Завершить</button><button class="ghost" onclick="act('event.cancel','${esc(e.id)}')">Отменить</button>`:''}<button class="danger" onclick="act('event.delete','${esc(e.id)}')">Удалить</button></div></div>`).join(''):'<div class="empty">Занятий нет.</div>'}window.act=async(a,id)=>{if(!confirm('Подтвердить действие?'))return;try{await call(a,{id});await load()}catch(e){alert(e.message)}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const r=b.dataset.mode==='reg';$('loginBox').hidden=r;$('regBox').hidden=!r;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('enter').onclick=async()=>{try{$('gateStatus').textContent='Вхожу…';const j=await api('login',{login:$('login').value,password:$('pass').value,device:device()},false);SESSION=j.session;ME=j.me;save();app()}catch(e){$('gateStatus').textContent=e.message;$('gateStatus').className='hint error'}};$('reg').onclick=async()=>{try{await api('register',{code:$('regpin').value,first:$('rfirst').value,last:$('rlast').value,login:$('rlogin').value,password:$('rpass').value},false);$('regStatus').textContent='Готово. Теперь войдите.';$('regStatus').className='hint ok'}catch(e){$('regStatus').textContent=e.message;$('regStatus').className='hint error'}};$('create').onsubmit=async e=>{e.preventDefault();try{$('status').textContent='Сохраняю…';await call('event.create',{type:$('type').value,title:$('title').value.trim(),place:$('place').value.trim(),date:$('date').value,gather:$('gather').value,start:$('start').value,duration:Number($('duration').value)||45,note:$('note').value.trim()});$('status').textContent='Занятие добавлено.';await load()}catch(x){$('status').textContent=x.message;$('status').className='hint error'}};$('reload').onclick=load;$('out').onclick=async()=>{try{await call('logout')}catch{}gate('Вы вышли.')};$('changePass').onclick=async()=>{try{await call('password',{current:$('currentPass').value,password:$('newPass').value});gate('Пароль изменён. Войдите снова.')}catch(e){$('passStatus').textContent=e.message;$('passStatus').className='hint error'}};(async()=>{try{const raw=localStorage.getItem(STORE)||sessionStorage.getItem(STORE);if(!raw)return;SESSION=JSON.parse(raw);if(SESSION.expires_at<Math.floor(Date.now()/1000)+30)await refresh();else ME=await api('me');app()}catch{gate('Сеанс закончился. Войдите снова.')}})();</script></body></html>
