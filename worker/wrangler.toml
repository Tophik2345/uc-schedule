name = "uc-schedule-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "uc-schedule"
database_id = "REPLACE_AFTER_D1_CREATE"

[vars]
ALLOWED_ORIGIN = "https://tophik2345.github.io"
SESSION_HOURS = "12"

# Secrets are configured with `wrangler secret put` or in the Cloudflare UI:
# DISCORD_WEBHOOK, DISCORD_REPORT_WEBHOOK, DISCORD_ROLE_ID, BOOTSTRAP_TOKEN
