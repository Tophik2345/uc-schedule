<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Повышения · УЦ</title>
<style>
  :root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
  .wrap{max-width:980px;margin:0 auto;padding:22px 14px 72px}
  .gate{max-width:420px;margin:8vh auto;padding:0 14px}
  .kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}
  h1{margin:0 0 6px;font-size:22px}
  .hint{margin:0 0 12px;color:var(--muted);font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
  label{display:block;margin:8px 0 5px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  input,select{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:14px system-ui}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{border:0;border-radius:8px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;background:var(--accent);color:#f3e6c4}
  button.ghost{background:#1c2024;color:var(--text);border:1px solid var(--line)}
  button.danger{background:#4a151c;color:#f3e6c4}
  button:disabled{opacity:.55;cursor:wait}
  .tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui;text-decoration:none}
  .tab.on{background:var(--accent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  tr:hover td{background:#1a1e22}
  a{color:#d7c39a}
  .muted{color:var(--muted);font-size:12px}
  .empty{padding:22px;color:var(--muted);text-align:center}
  .who{margin:0 0 10px;color:#c9ced2;font-size:13px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <p class="kicker">ФСБ · Управление УЦ</p>
  <h1>Повышения</h1>
  <p class="hint">Только инструкторам. Тот же вход, что у расписания.</p>
  <div class="panel">
    <label>Логин</label><input id="login" autocomplete="username">
    <label>Пароль</label><input id="pass" type="password" autocomplete="current-password">
    <div class="btns"><button type="button" id="enter">Войти</button></div>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <p class="kicker">ФСБ · Академия · Кадры УЦ</p>
  <h1>Таблица повышений</h1>
  <p class="who" id="who"></p>
  <p class="hint" id="status">сборка 1.3</p>
  <div class="tabs">
    <a class="tab" href="raspisanie-admin.html">Расписание</a>
    <button class="tab on" type="button">Повышения</button>
    <button class="tab ghost" type="button" id="out">Выйти</button>
  </div>
  <form class="panel" id="f">
    <div class="grid">
      <div>
        <label>Категория</label>
        <select id="cat">
          <option value="now">Повысить сегодня</option>
          <option value="after">Повысить после 00:00</option>
        </select>
      </div>
      <div>
        <label>Кого повысить</label>
        <input id="whoName" placeholder="Фамилия Имя">
      </div>
    </div>
    <div class="grid3">
      <div>
        <label>С ранга</label>
        <select id="from">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </div>
      <div>
        <label>На ранг</label>
        <select id="to">
          <option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <div>
        <label>Кто пишет</label>
        <input id="author" readonly>
      </div>
    </div>
    <label>Ссылка на кадровый аудит / отчёт</label>
    <input id="link" placeholder="https://forum.russia.online/...">
    <div class="btns">
      <button type="submit" id="addBtn">Добавить в таблицу</button>
      <button type="button" class="ghost" id="ping">Проверить связь</button>
    </div>
  </form>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" type="button" data-list="now">Сегодня</button>
      <button class="tab" type="button" data-list="after">После 00:00</button>
      <button class="tab" type="button" data-list="done">Уже повысили</button>
    </div>
    <label>Поиск по фамилии</label>
    <input id="q" placeholder="Начни писать фамилию">
    <div id="table"></div>
  </div>
</div>
<script>
const API='https://hpeqnqsgcqskjpdjkxcm.supabase.co/functions/v1/uc-api', STORE='uc-session-v2';
let SESSION=null, ME=null, ITEMS=[], TAB='now', Q='', BUSY=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function device(){let d=localStorage.getItem('uc-device');if(!d){d='DEV-'+crypto.randomUUID();localStorage.setItem('uc-device',d)}return d}
function readSession(){for(const x of [localStorage,sessionStorage])try{const s=JSON.parse(x.getItem(STORE)||'null');if(s?.access_token)return s}catch{}return null}
function saveSession(){if(SESSION)localStorage.setItem(STORE,JSON.stringify(SESSION))}
function clearSession(){localStorage.removeItem(STORE);sessionStorage.removeItem(STORE);SESSION=ME=null}
async function api(action,input={},auth=true){const headers={'Content-Type':'application/json'};if(auth&&SESSION?.access_token)headers.Authorization='Bearer '+SESSION.access_token;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,input}),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Ошибка сервера');return j}
async function call(action,input={}){try{return await api(action,input)}catch(e){if(/Сеанс завершён|Войдите/.test(e.message)&&SESSION?.refresh_token){const j=await api('refresh',{refresh_token:SESSION.refresh_token},false);SESSION=j.session;ME=j.me;saveSession();return api(action,input)}throw e}}
function setStatus(t){$('status').textContent=t}
function setBusy(v){BUSY=v;$('addBtn').disabled=v;$('ping').disabled=v}
function goodLink(s){try{const u=new URL(s);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}
function openLink(s){try{const u=new URL(s);const h=u.hostname.replace(/^www\./,'');if(/^(discord\.com|discordapp\.com|canary\.discord\.com|ptb\.discord\.com)$/.test(h)&&u.pathname.startsWith('/channels/'))return 'discord://-'+u.pathname}catch{}return s}
function setTab(name){TAB=name;document.querySelectorAll('[data-list]').forEach(x=>x.classList.toggle('on',x.dataset.list===TAB))}
function counts(){const n={now:0,after:0,done:0};ITEMS.forEach(x=>x.done?n.done++:x.cat==='after'?n.after++:n.now++);document.querySelectorAll('[data-list]').forEach(b=>b.textContent=(b.dataset.list==='now'?'Сегодня':b.dataset.list==='after'?'После 00:00':'Уже повысили')+' ('+n[b.dataset.list]+')')}
function render(){counts();const q=Q.trim().toLowerCase(),list=ITEMS.filter(x=>(TAB==='done'?x.done:!x.done&&x.cat===TAB)&&(!q||String(x.name||'').toLowerCase().includes(q)));$('table').innerHTML=list.length?`<table><thead><tr><th>Кого</th><th>Ранг</th><th>Аудит</th><th>Кто пишет</th><th>Кто повысил</th><th></th></tr></thead><tbody>${list.slice().reverse().map(x=>`<tr><td><b>${esc(x.name||'—')}</b></td><td>${esc(x.from||'—')} → ${esc(x.to||'—')}</td><td>${x.link?`<a href="${esc(openLink(x.link))}">отчёт</a>`:'—'}</td><td>${esc(x.author||'—')}<div class="muted">${esc(String(x.at||'').slice(0,16).replace('T',' '))}</div></td><td>${esc(x.promotedBy||'—')}</td><td>${x.done?'':`<button class="ghost" data-ok="${esc(x.id)}" data-version="${Number(x.version)||0}">Повысить</button>`}<button class="danger" data-del="${esc(x.id)}" data-version="${Number(x.version)||0}">Убрать</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Пока пусто в этой вкладке.</div>';
 document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>change('promotion.done',b.dataset.ok,Number(b.dataset.version),'Заявка отмечена выполненной.'));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Убрать из таблицы?'))change('promotion.delete',b.dataset.del,Number(b.dataset.version),'Заявка удалена.')});}
async function load(){ITEMS=await call('promotions');render()}
async function change(action,id,version,ok){if(BUSY)return;setBusy(true);try{await call(action,{id,version});await load();setStatus(ok)}catch(e){setStatus(e.message)}finally{setBusy(false)}}
async function openApp(){const name=[ME?.last,ME?.first].filter(Boolean).join(' ')||ME?.login||'Инструктор';$('gate').hidden=true;$('app').hidden=false;$('who').textContent='Вы вошли как '+name;$('author').value=name;setStatus('Загружаю таблицу…');try{await load();setStatus('Общая таблица Supabase · строк: '+ITEMS.length)}catch(e){setStatus(e.message)}}
async function doLogin(){const login=$('login').value.trim().toLowerCase(),password=$('pass').value;if(!login||!password)return alert('Введите логин и пароль.');try{const j=await api('login',{login,password,device:device()},false);SESSION=j.session;ME=j.me;saveSession();await openApp()}catch(e){alert(e.message)}}
$('enter').onclick=doLogin;$('pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('login').onkeydown=e=>{if(e.key==='Enter')$('pass').focus()};
$('out').onclick=async()=>{try{await call('logout')}catch{}clearSession();location.reload()};
$('q').oninput=e=>{Q=e.target.value;render()};document.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>{setTab(b.dataset.list);render()});
$('ping').onclick=async()=>{if(BUSY)return;setBusy(true);try{await load();setStatus('Связь с Supabase работает. Строк: '+ITEMS.length)}catch(e){setStatus('Не доходит: '+e.message)}finally{setBusy(false)}};
$('f').onsubmit=async e=>{e.preventDefault();if(BUSY)return;const name=$('whoName').value.trim(),link=$('link').value.trim(),from=Number($('from').value),to=Number($('to').value),cat=$('cat').value;if(!name)return setStatus('Напишите, кого повысить.');if(!goodLink(link))return setStatus('Нужна правильная ссылка на отчёт.');if(to<=from)return setStatus('Новый ранг должен быть выше старого.');setBusy(true);try{await call('promotion.create',{cat,name,from,to,link});$('whoName').value='';$('link').value='';setTab(cat);await load();setStatus('Добавлен: '+name)}catch(e){setStatus(e.message)}finally{setBusy(false)}};
(async()=>{SESSION=readSession();if(!SESSION)return;try{const j=await api('me');ME=j;await openApp()}catch{clearSession()}})();
</script>
</body>
</html>
