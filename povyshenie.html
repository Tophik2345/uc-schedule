<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Повышения · УЦ</title>
<style>
  :root{--bg:#101214;--panel:#171a1d;--line:#2a3036;--text:#e8eaec;--muted:#8b9298;--accent:#7a1f2b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg)}
  .wrap{max-width:980px;margin:0 auto;padding:22px 14px 72px}
  .gate{max-width:420px;margin:8vh auto;padding:0 14px}
  .kicker{margin:0 0 6px;color:#9aa0a6;letter-spacing:.16em;font-size:10px;text-transform:uppercase;font-weight:700}
  h1{margin:0 0 6px;font-size:22px}
  .hint{margin:0 0 12px;color:var(--muted);font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
  label{display:block;margin:8px 0 5px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  input,select{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:14px system-ui}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{border:0;border-radius:8px;padding:10px 12px;font:700 13px system-ui;cursor:pointer;background:var(--accent);color:#f3e6c4}
  button.ghost{background:#1c2024;color:var(--text);border:1px solid var(--line)}
  button.danger{background:#4a151c;color:#f3e6c4}
  button:disabled{opacity:.55;cursor:wait}
  .tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .tab{background:#1c2024;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font:700 12px system-ui;text-decoration:none}
  .tab.on{background:var(--accent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  tr:hover td{background:#1a1e22}
  a{color:#d7c39a}
  .muted{color:var(--muted);font-size:12px}
  .empty{padding:22px;color:var(--muted);text-align:center}
  .who{margin:0 0 10px;color:#c9ced2;font-size:13px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <p class="kicker">ФСБ · Управление УЦ</p>
  <h1>Повышения</h1>
  <p class="hint">Только инструкторам. Тот же вход, что у расписания.</p>
  <div class="panel">
    <label>Логин</label><input id="login" autocomplete="username">
    <label>Пароль</label><input id="pass" type="password" autocomplete="current-password">
    <div class="btns"><button type="button" id="enter">Войти</button></div>
  </div>
</div>
<div class="wrap" id="app" hidden>
  <p class="kicker">ФСБ · Академия · Кадры УЦ</p>
  <h1>Таблица повышений</h1>
  <p class="who" id="who"></p>
  <p class="hint" id="status">сборка 1.3</p>
  <div class="tabs">
    <a class="tab" href="raspisanie-admin.html">Расписание</a>
    <button class="tab on" type="button">Повышения</button>
    <button class="tab ghost" type="button" id="out">Выйти</button>
  </div>
  <form class="panel" id="f">
    <div class="grid">
      <div>
        <label>Категория</label>
        <select id="cat">
          <option value="now">Повысить</option>
          <option value="after">Повысить после 00:00</option>
        </select>
      </div>
      <div>
        <label>Кого повысить</label>
        <input id="whoName" placeholder="Фамилия Имя">
      </div>
    </div>
    <div class="grid3">
      <div>
        <label>С ранга</label>
        <select id="from">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </div>
      <div>
        <label>На ранг</label>
        <select id="to">
          <option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <div>
        <label>Кто пишет</label>
        <input id="author" readonly>
      </div>
    </div>
    <label>Ссылка на кадровый аудит / отчёт</label>
    <input id="link" placeholder="https://forum.russia.online/...">
    <div class="btns">
      <button type="submit" id="addBtn">Добавить в таблицу</button>
      <button type="button" class="ghost" id="ping">Проверить связь</button>
    </div>
  </form>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" type="button" data-list="now">Повысить</button>
      <button class="tab" type="button" data-list="after">После 00:00</button>
      <button class="tab" type="button" data-list="done">Уже повысили</button>
    </div>
    <label>Поиск по фамилии</label>
    <input id="q" placeholder="Начни писать фамилию">
    <div id="table"></div>
  </div>
</div>
<script>
const GH={owner:"Tophik2345",repo:"uc-schedule",path:"povyshenie.json",branch:"main"};
const SALT="uc-fsb-schedule-2026";
let USER="", ITEMS=[], TAB="now", Q="", BUSY=false;
function localItems(){try{return parseDoc(JSON.parse(localStorage.getItem("uc_promo")||"{}"))}catch(e){return[]}}
function saveLocal(list){localStorage.setItem("uc_promo", JSON.stringify({updated:new Date().toISOString(),items:list||[]}))}
function mergeItems(a,b){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(x=>{
    if(!x||!x.id||x._ping) return;
    const old=map.get(x.id);
    if(!old) map.set(x.id,x);
    else map.set(x.id,Object.assign({},old,x,{done:!!(old.done||x.done),promotedBy:x.promotedBy||old.promotedBy||""}));
  });
  return [...map.values()];
}
function users(){try{return JSON.parse(localStorage.getItem("uc_users")||"[]")}catch(e){return[]}}
function saveUsers(list){localStorage.setItem("uc_users", JSON.stringify(list))}
function mergeUsers(a,b){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(u=>{
    if(!u||!u.login) return;
    const k=String(u.login).toLowerCase();
    if(!map.has(k)) map.set(k,u);
  });
  return [...map.values()];
}
async function pullUsers(){
  const urls=[
    "https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/main/users.json?t="+Date.now(),
    "https://"+GH.owner+".github.io/"+GH.repo+"/users.json?t="+Date.now()
  ];
  let remote=[];
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) continue;
      const j=await r.json();
      remote=j.users||[];
      if(remote.length) break;
    }catch(e){}
  }
  const all=mergeUsers(remote, users());
  saveUsers(all);
  return all;
}
function mskDate(){
  const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"});
  const p=Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return p.year+"-"+p.month+"-"+p.day;
}
function itemDate(iso){
  if(!iso) return "";
  const d=new Date(iso);
  if(isNaN(+d)) return "";
  const fmt=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"});
  const p=Object.fromEntries(fmt.formatToParts(d).map(x=>[x.type,x.value]));
  return p.year+"-"+p.month+"-"+p.day;
}
function fixLink(s){
  s=String(s||"").trim();
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s="https://"+s;
  return s;
}
function goodLink(s){
  try{const u=new URL(s);return u.protocol==="http:"||u.protocol==="https:"}catch(e){return false}
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
async function hashPass(s){
  const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT+"|"+s));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function _k(){
  const a="Nkt6NXIza21MY1lWcWdz";
  const b="UUI0cHhrZ2VEeWV6QU9ZRG40QnV5X3BoZw==";
  return atob(a+b).split("").reverse().join("");
}
function setStatus(t){document.getElementById("status").textContent=t}
function setBusy(v){
  BUSY=v;
  document.getElementById("addBtn").disabled=v;
  document.getElementById("ping").disabled=v;
}
function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin=""; bytes.forEach(x=>bin+=String.fromCharCode(x));
  return btoa(bin);
}
function utf8b64(b64){
  const bin=atob(String(b64||"").replace(/\n/g,""));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
async function gh(path, method, body){
  const r=await fetch("https://api.github.com"+path,{
    method,
    headers:{
      Authorization:"Bearer "+_k(),
      Accept:"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",
      "Content-Type":"application/json"
    },
    cache:"no-store",
    body:body?JSON.stringify(body):undefined
  });
  const raw=await r.text();
  let j={}; try{j=JSON.parse(raw)}catch(e){}
  if(!r.ok) throw new Error(j.message||("GitHub "+r.status));
  return j;
}
function parseDoc(data){
  const doc=data&&typeof data==="object"?data:{};
  return Array.isArray(doc.items)?doc.items.filter(x=>x&&x.id&&!x._ping):[];
}
async function readRemote(){
  const cur=await gh("/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path+"?ref="+GH.branch+"&t="+Date.now(),"GET");
  let doc={};
  try{doc=JSON.parse(utf8b64(cur.content))}catch(e){doc={items:[]}}
  return {sha:cur.sha, items:parseDoc(doc)};
}
async function load(){
  const remote=await readRemote();
  ITEMS=mergeItems(remote.items, localItems());
  saveLocal(ITEMS);
  return remote;
}
async function mutate(fn){
  let last="не записалось";
  for(let i=0;i<6;i++){
    const cur=await readRemote();
    const next=fn(mergeItems(cur.items, localItems()).map(x=>({...x})));
    ITEMS=next;
    saveLocal(next);
    try{
      await gh("/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path,"PUT",{
        message:"повышения УЦ "+new Date().toISOString().slice(0,16).replace("T"," "),
        content:b64utf8(JSON.stringify({updated:new Date().toISOString(),items:next})),
        branch:GH.branch,
        sha:cur.sha
      });
      ITEMS=next;
      return next;
    }catch(e){
      last=e.message||String(e);
      if(!/does not match|sha|409/i.test(last)) throw e;
    }
  }
  throw new Error(last);
}
function setTab(name){
  TAB=name;
  document.querySelectorAll("[data-list]").forEach(x=>x.classList.toggle("on",x.dataset.list===TAB));
}
function render(){
  const q=Q.trim().toLowerCase();
  const list=ITEMS.filter(x=>{
    if(TAB==="done"){ if(!x.done) return false; }
    else if(x.done || x.cat!==TAB) return false;
    if(q && !(x.name||"").toLowerCase().includes(q)) return false;
    return true;
  });
  const box=document.getElementById("table");
  if(!list.length){
    box.innerHTML='<div class="empty">Пока пусто в этой вкладке.</div>';
    return;
  }
  box.innerHTML=`<table>
    <thead><tr>
      <th>Кого</th><th>Ранг</th><th>Аудит</th><th>Кто пишет</th><th>Кто повысил</th><th></th>
    </tr></thead>
    <tbody>${list.slice().reverse().map(x=>`<tr>
      <td><b>${esc(x.name||"—")}</b></td>
      <td>${esc(x.from||"—")} → ${esc(x.to||"—")}</td>
      <td>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">отчёт</a>`:"—"}</td>
      <td>${esc(x.author||"—")}<div class="muted">${esc((x.at||"").slice(0,16).replace("T"," "))}</div></td>
      <td>${esc(x.promotedBy||"—")}<div class="muted">${x.promotedBy?esc((x.promotedAt||"").slice(0,16).replace("T"," ")):"ещё не приняли"}</div></td>
      <td>
        ${x.done?"":`<button class="ghost" data-ok="${esc(x.id)}">Повысить</button>`}
        <button class="danger" data-id="${esc(x.id)}">Убрать</button>
      </td>
    </tr>`).join("")}</tbody>
  </table>`;
  box.querySelectorAll("button[data-id]").forEach(b=>{
    b.onclick=async()=>{
      if(BUSY) return;
      if(!confirm("Убрать из таблицы?")) return;
      setBusy(true);
      setStatus("Убираю...");
      try{
        await mutate(list=>list.filter(x=>x.id!==b.dataset.id));
        render();
        setStatus("Убрали. У всех обновлено.");
      }catch(e){setStatus("Не ушло: "+e.message)}
      setBusy(false);
    };
  });
  box.querySelectorAll("button[data-ok]").forEach(b=>{
    b.onclick=async()=>{
      if(BUSY) return;
      setBusy(true);
      setStatus("Пишу, кто принял...");
      try{
        await mutate(list=>list.map(x=>{
          if(x.id!==b.dataset.ok) return x;
          return {...x, done:true, promotedBy:USER, promotedAt:new Date().toISOString()};
        }));
        setTab("done");
        render();
        setStatus("Принял: "+USER+". Строка во вкладке «Уже повысили».");
      }catch(e){setStatus("Не ушло: "+e.message)}
      setBusy(false);
    };
  });
}
async function openApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  document.getElementById("who").textContent="Вы вошли как "+USER;
  document.getElementById("author").value=USER;
  setStatus("Гружу общую таблицу...");
  try{
    await load();
    const today=mskDate();
    const need=ITEMS.some(x=>x.cat==="after" && !x.done && itemDate(x.at) && itemDate(x.at)<today);
    if(need){
      await mutate(list=>list.map(x=>{
        if(x.cat==="after" && !x.done && itemDate(x.at) && itemDate(x.at)<today){
          return {...x, cat:"now", updatedBy:"система 00:00"};
        }
        return x;
      }));
      setStatus("После 00:00 перенёс заявки в «Повысить».");
    }else{
      setStatus("сборка 1.4 · общая таблица · строк: "+ITEMS.length);
    }
    render();
  }catch(e){
    setStatus("Не открылась база: "+e.message);
    render();
  }
}
async function doLogin(){
  const login=document.getElementById("login").value.trim().toLowerCase();
  const pass=document.getElementById("pass").value;
  if(!login||!pass){alert("Введи логин и пароль.");return;}
  let list=users();
  try{list=await pullUsers()}catch(e){}
  const u=list.find(x=>String(x.login||"").toLowerCase()===login);
  const h=await hashPass(pass);
  const ok=u && (u.hash?u.hash===h:u.pass===pass);
  if(!ok){alert("Нет такого логина. Сначала войди в расписание инструкторов — тот же аккаунт.");return;}
  USER=(u.first||"")+" "+(u.last||"");
  USER=USER.trim()||login;
  localStorage.setItem("uc_user", USER);
  localStorage.setItem("uc_login", login);
  openApp();
}
document.getElementById("enter").onclick=doLogin;
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
document.getElementById("login").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("pass").focus()});
document.getElementById("out").onclick=()=>{
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
};
document.getElementById("q").oninput=e=>{Q=e.target.value;render()};
document.querySelectorAll("[data-list]").forEach(btn=>{
  btn.onclick=()=>{setTab(btn.dataset.list);render()};
});
document.getElementById("ping").onclick=async()=>{
  if(BUSY) return;
  setBusy(true);
  setStatus("Проверяю связь с GitHub...");
  try{
    const remote=await readRemote();
    ITEMS=remote.items;
    render();
    setStatus("Связь есть. В общей таблице сейчас "+ITEMS.length+" строк. Это не добавление человека.");
  }catch(e){setStatus("Не доходит: "+e.message)}
  setBusy(false);
};
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  if(BUSY) return;
  const name=document.getElementById("whoName").value.trim();
  const link=fixLink(document.getElementById("link").value);
  const from=Number(document.getElementById("from").value);
  const to=Number(document.getElementById("to").value);
  const cat=document.getElementById("cat").value;
  if(!name){setStatus("Напиши кого повысить.");return;}
  if(!goodLink(link)){setStatus("Нужна ссылка на отчёт.");alert("Вставь ссылку на кадровый аудит.");return;}
  if(!(to>from)){setStatus("Ранг «на» должен быть выше, чем «с».");return;}
  const row={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    cat, name, from:String(from), to:String(to), link,
    author:USER,
    at:new Date().toISOString()
  };
  setBusy(true);
  setStatus("Пишу «"+name+"» в общую таблицу...");
  try{
    await mutate(list=>{
      const same=list.some(x=>!x.done && String(x.name).toLowerCase()===name.toLowerCase() && x.from===row.from && x.to===row.to);
      if(same) return list;
      return list.concat(row);
    });
    setTab(cat==="after"?"after":"now");
    Q="";
    document.getElementById("q").value="";
    document.getElementById("whoName").value="";
    document.getElementById("link").value="";
    render();
    setStatus("Добавлен: "+name+". Вкладка «"+(cat==="after"?"После 00:00":"Повысить")+"».");
  }catch(err){
    setStatus("Не ушло: "+err.message);
  }
  setBusy(false);
};
(function(){
  const until=Number(localStorage.getItem("uc_until")||0);
  if(localStorage.getItem("uc_remember")==="1" && localStorage.getItem("uc_user") && Date.now()<until){
    USER=localStorage.getItem("uc_user");
    openApp();
  }
})();
</script>
</body>
</html>
