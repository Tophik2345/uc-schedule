<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тесты УП-9 · УЦ</title><style>
:root{--bg:#101214;--panel:#191d21;--line:#30363c;--text:#eef0f1;--muted:#aeb6bd;--accent:#8c2838}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.5 system-ui,sans-serif;color:var(--text);background:linear-gradient(90deg,#101214e8,#101214d8),url('assets/up9-test-background.webp') center/cover fixed,var(--bg)}main{max-width:1000px;margin:auto;padding:30px 15px 80px}h1{margin:0 0 6px;font-size:28px}h2{font-size:20px;margin:0 0 12px}.muted{color:var(--muted)}.panel{background:#191d21ed;border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 10px 25px #0003}.narrow{max-width:470px;margin:8vh auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.grow{flex:1}input,textarea,select{background:#111416;color:var(--text);border:1px solid #515961;border-radius:8px;padding:11px;font:inherit;width:100%}textarea{min-height:72px}label{display:block;margin:12px 0 5px;color:var(--muted)}button,a.button{background:var(--accent);color:white;border:0;border-radius:8px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,a.secondary{background:#30353a}button:disabled{opacity:.5;cursor:wait}.card{padding:14px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.options{display:grid;gap:8px}.option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #515961;border-radius:8px;cursor:pointer}.option input{width:auto}.option:has(input:checked){border-color:#c76b7a;background:#72253155}.timer{font-size:22px;font-weight:800;color:#ffb2b9}.error{color:#ffbdc5}.ok{color:#a8e1b8}.question{margin:16px 0}.question strong{display:block;margin-bottom:8px}.edit-option{display:flex;gap:8px;align-items:center;margin:6px 0}.edit-option input[type=radio]{width:auto}.edit-option button{white-space:nowrap}.hidden{display:none!important}@media(max-width:600px){main{padding-top:17px}.panel{padding:14px}h1{font-size:23px}}
</style></head><body><main><header class="row space"><div><div class="muted">ФСБ · Управление УП-9</div><h1>Тестирование</h1></div><div class="row"><a class="button secondary" href="raspisanie-admin.html">Расписание</a><button class="secondary hidden" id="logout">Выйти</button></div></header><p id="status" role="status" class="muted"></p>
<section id="gate" class="panel narrow"><h2>Вход</h2><label>Логин<input id="login" autocomplete="username"></label><label>Пароль<input id="pass" type="password" autocomplete="current-password"></label><p><button id="enter">Войти</button></p></section>
<section id="setup" class="panel narrow hidden"><h2>Первичная настройка владельца</h2><p class="muted">Создайте новый аккаунт после очистки базы.</p><label>Код настройки<input id="setupCode" type="password"></label><label>Логин<input id="setupLogin" autocomplete="username"></label><label>Имя<input id="setupFirst"></label><label>Фамилия<input id="setupLast"></label><label>Новый пароль (от 12 символов)<input id="setupPass" type="password" autocomplete="new-password"></label><p><button id="setupSubmit">Создать владельца</button></p></section>
<section id="dashboard" class="hidden"><div id="owner" class="hidden"><div class="panel"><h2>Управление тестами</h2><button id="new">Создать тест</button></div><div id="editor" class="panel hidden"><h2 id="editorTitle">Новый тест</h2><label>Название<input id="title" maxlength="160"></label><label>Описание<textarea id="description" maxlength="2000"></textarea></label><label>Время на прохождение, минут<input id="minutes" type="number" min="1" max="180" value="20"></label><div id="editQuestions"></div><div class="row"><button id="addQuestion" class="secondary">Добавить вопрос</button><button id="save">Сохранить черновик</button><button id="cancel" class="secondary">Закрыть редактор</button></div></div></div><div class="panel"><h2>Тесты</h2><div id="tests"></div></div></section>
<section id="attempt" class="panel hidden"><div class="row space"><h2 id="testTitle"></h2><div class="timer" id="timer"></div></div><p class="muted" id="testDescription"></p><div id="questions"></div><button id="submit">Отправить ответы</button></section>
<section id="result" class="panel hidden"><h2>Результат</h2><div id="resultBody"></div><button id="back" class="secondary">К списку тестов</button></section>
<section id="results" class="panel hidden"><h2>Результаты участников</h2><div id="resultsBody"></div><button id="resultsBack" class="secondary">К списку тестов</button></section>
</main><script>
const API='https://hpeqnqsgcqskjpdjkxcm.supabase.co/functions/v1/uc-api',STORE='uc-session-v2';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null,me=null,tests=[],active=null,editing=null,tick=null,ending=false,armed=false;
function device(){let d=localStorage.getItem('uc-device');if(!d){d='DEV-'+crypto.randomUUID();localStorage.setItem('uc-device',d)}return d}
function status(s,bad=false){$('status').textContent=s;$('status').className=bad?'error':'muted'}function show(id){for(const x of ['dashboard','attempt','result','results'])$(x).classList.toggle('hidden',x!==id)}
async function api(action,input={},auth=true){const headers={'Content-Type':'application/json'};if(auth&&session?.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,input}),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Ошибка сервера');return j}
async function call(action,input={}){try{return await api(action,input)}catch(e){if(/Сеанс завершён|Войдите/.test(e.message)&&session?.refresh_token){const j=await api('refresh',{refresh_token:session.refresh_token},false);session=j.session;me=j.me;localStorage.setItem(STORE,JSON.stringify(session));return api(action,input)}throw e}}
async function login(){try{const j=await api('login',{login:$('login').value.trim().toLowerCase(),password:$('pass').value,device:device()},false);session=j.session;me=j.me;localStorage.setItem(STORE,JSON.stringify(session));await boot()}catch(e){status(e.message,true)}}
$('enter').onclick=login;$('pass').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=async()=>{try{await call('logout')}catch{}localStorage.removeItem(STORE);session=null;location.reload()};
async function boot(){if(!me)me=await call('me');if(me.mustChangePassword){status('Сначала смените временный пароль в панели расписания.',true);return}$('gate').classList.add('hidden');$('logout').classList.remove('hidden');$('owner').classList.toggle('hidden',!me.owner);await refresh();}
async function refresh(){const j=await call('test.list');tests=j.tests||[];show('dashboard');$('tests').innerHTML=tests.length?tests.map(t=>`<div class="card"><div class="row space"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(t.description)} · ${t.minutes} мин · ${t.status==='published'?'Открыт':t.status==='draft'?'Черновик':'Закрыт'}</div></div><div class="row">${me.owner&&t.status==='draft'?`<button data-edit="${t.id}" class="secondary">Изменить</button><button data-publish="${t.id}">Опубликовать</button>`:''}${me.owner&&t.status==='published'?`<button data-close="${t.id}" class="secondary">Закрыть</button>`:''}${me.owner?`<button data-results="${t.id}" class="secondary">Результаты</button>`:''}${t.attempt?`<button data-view="${t.id}">${t.attempt.finishedAt?'Мой результат':'Продолжить'}</button>`:t.status==='published'?`<button data-start="${t.id}">Начать</button>`:''}</div></div></div>`).join(''):'<p class="muted">Пока нет доступных тестов.</p>';
$('tests').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const k=Object.keys(b.dataset)[0],id=b.dataset[k];try{if(k==='edit')edit(tests.find(t=>t.id===id));else if(k==='start'){if(!confirm('После начала тест завершится при первом переключении вкладки или окна, даже случайном. Начать?'))return;await openTest(id,true)}else if(k==='view')await openTest(id,false);else if(k==='results')await results(id);else{await call(k==='publish'?'test.publish':'test.close',{id});await refresh()}}catch(e){status(e.message,true)}});
}
let draft=[];function edit(t){editing=t?.id||null;$('editor').classList.remove('hidden');$('editorTitle').textContent=t?'Редактировать тест':'Новый тест';$('title').value=t?.title||'';$('description').value=t?.description||'';$('minutes').value=t?.minutes||20;draft=t?structuredClone(t.questions):[{text:'',options:['',''],correct:0}];renderEditor();$('editor').scrollIntoView()}
function readEditor(){document.querySelectorAll('#editQuestions .card').forEach((card,i)=>{draft[i].text=card.querySelector('.qtext').value;draft[i].correct=Number(card.querySelector('input[type=radio]:checked')?.value??0);draft[i].options=[...card.querySelectorAll('.opttext')].map(x=>x.value)})}function renderEditor(){const host=$('editQuestions');host.innerHTML=draft.map((q,i)=>`<div class="card"><div class="row space"><strong>Вопрос ${i+1}</strong><button class="secondary" data-removeq="${i}">Удалить вопрос</button></div><label>Текст вопроса<textarea class="qtext" maxlength="1000">${esc(q.text)}</textarea></label><div>${q.options.map((o,n)=>`<div class="edit-option"><input type="radio" name="correct${i}" value="${n}" ${n===Number(q.correct)?'checked':''} title="Правильный ответ"><input class="opttext" maxlength="500" value="${esc(o)}" placeholder="Вариант ${n+1}"><button class="secondary" data-removeopt="${i}:${n}">×</button></div>`).join('')}</div><button class="secondary" data-addopt="${i}">Добавить вариант</button></div>`).join('');host.querySelectorAll('button').forEach(b=>b.onclick=()=>{readEditor();if(b.dataset.removeq!==undefined){if(draft.length>1)draft.splice(Number(b.dataset.removeq),1)}else if(b.dataset.addopt!==undefined){const q=draft[Number(b.dataset.addopt)];if(q.options.length<8)q.options.push('')}else{const [i,n]=b.dataset.removeopt.split(':').map(Number);if(draft[i].options.length>2){draft[i].options.splice(n,1);if(draft[i].correct===n)draft[i].correct=0;else if(draft[i].correct>n)draft[i].correct--}}renderEditor()})}
$('new').onclick=()=>edit(null);$('addQuestion').onclick=()=>{readEditor();if(draft.length<100){draft.push({text:'',options:['',''],correct:0});renderEditor()}};$('cancel').onclick=()=>$('editor').classList.add('hidden');$('save').onclick=async()=>{readEditor();try{await call('test.save',{id:editing,title:$('title').value,description:$('description').value,minutes:Number($('minutes').value),questions:draft});$('editor').classList.add('hidden');await refresh();status('Черновик сохранён')}catch(e){status(e.message,true)}};
async function openTest(id,start){const data=await call(start?'test.start':'test.view',{id});active=data;ending=false;if(data.finishedAt){renderResult();return}show('attempt');$('testTitle').textContent=data.title;$('testDescription').textContent=data.description;$('questions').innerHTML=data.questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${esc(q.text)}</strong><div class="options">${q.options.map((o,n)=>`<label class="option"><input type="radio" name="q${i}" value="${n}" ${Number(data.answers?.[i])===n&&data.answers?.[i]!==undefined?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('');$('questions').querySelectorAll('input').forEach(input=>input.onchange=async()=>{try{await call('test.answer',{id,index:Number(input.name.slice(1)),option:Number(input.value)});active.answers[input.name.slice(1)]=Number(input.value)}catch(e){status(e.message,true)}});armed=true;clearInterval(tick);tick=setInterval(clock,300);clock()}
function clock(){if(!active||!armed)return;const remaining=Math.max(0,new Date(active.endsAt).getTime()-Date.now());$('timer').textContent=`${String(Math.floor(remaining/60000)).padStart(2,'0')}:${String(Math.ceil(remaining%60000/1000)).padStart(2,'0')}`;if(!remaining)finish('time')}
function selectedAnswers(){const answers={};$('questions').querySelectorAll('input:checked').forEach(x=>answers[x.name.slice(1)]=Number(x.value));return answers}
async function finish(reason){if(!active||ending||!armed)return;ending=true;armed=false;clearInterval(tick);const id=active.id,answers=selectedAnswers();try{const data=await call('test.finish',{id,reason,answers});active=data;renderResult()}catch(e){status('Завершение не подтверждено сервером: '+e.message,true);show('dashboard');ending=false}}
function renderResult(){armed=false;clearInterval(tick);show('result');const d=active;$('resultBody').innerHTML=`<p><strong>${esc(d.title)}</strong> · ${esc(d.reason)} · ${d.score} из ${d.questions.length}</p>${d.questions.map((q,i)=>`<div class="card"><strong>${i+1}. ${esc(q.text)}</strong><p>Ваш ответ: ${d.answers?.[i]===undefined?'—':esc(q.options[d.answers[i]])}</p><p class="ok">Правильный ответ: ${esc(q.options[d.correct[i]])}</p></div>`).join('')}`}
$('submit').onclick=()=>finish('submit');$('back').onclick=refresh;$('resultsBack').onclick=refresh;
async function results(id){const t=tests.find(t=>t.id===id),rows=await call('test.results',{id});show('results');$('resultsBody').innerHTML=`<p>${esc(t.title)}</p>${rows.length?rows.map(r=>`<div class="card"><strong>${esc(r.name)} (${esc(r.login)})</strong><p>${r.score===null?'В процессе':`${r.score} из ${t.questions.length}`} · ${esc(r.reason||'В процессе')}</p><div class="muted">Начало: ${esc(r.startedAt)} · Конец: ${esc(r.finishedAt||'—')}</div>${t.questions.map((q,i)=>`<div>${i+1}. ${esc(q.text)} — ${r.answers?.[i]===undefined?'—':esc(q.options[r.answers[i]])}</div>`).join('')}</div>`).join(''):'<p class="muted">Попыток пока нет.</p>'}`}
function lostFocus(){if(armed&&active&&!ending)finish('blur')}document.addEventListener('visibilitychange',()=>{if(document.hidden)lostFocus()});window.addEventListener('blur',lostFocus);window.addEventListener('pagehide',()=>{if(armed&&active){const body=JSON.stringify({action:'test.finish',input:{id:active.id,reason:'blur',answers:selectedAnswers()}});if(session?.access_token)fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body,keepalive:true}).catch(()=>{})}});
$('setupSubmit').onclick=async()=>{try{await api('setup.owner',{code:$('setupCode').value,login:$('setupLogin').value,first:$('setupFirst').value,last:$('setupLast').value,password:$('setupPass').value},false);$('setup').classList.add('hidden');$('gate').classList.remove('hidden');$('login').value=$('setupLogin').value;status('Владелец создан. Войдите с новым паролем.')}catch(e){status(e.message,true)}};
(async()=>{try{session=JSON.parse(localStorage.getItem(STORE)||sessionStorage.getItem(STORE)||'null');if(session?.access_token){try{await boot();return}catch{localStorage.removeItem(STORE);session=null}}const setup=await api('setup.status',{},false);$('setup').classList.toggle('hidden',!setup.ready);$('gate').classList.toggle('hidden',setup.ready)}catch(e){status(e.message,true)}})();
</script></body></html>
