name: Fix photo persistence

on:
  push:
    paths:
      - '.github/workflows/fix-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch raspisanie-admin.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('raspisanie-admin.html')
          s = p.read_text(encoding='utf-8')
          old = '''  const trash=(TRASH||[]).slice(0,200);
          let raw=JSON.stringify({updated:new Date().toISOString(),events,trash});
          if(raw.length>90000){
            raw=JSON.stringify({
              updated:new Date().toISOString(),
              events:events.map(ev=>Object.assign({},ev,{photo:""})),
              trash:trash.map(ev=>Object.assign({},ev,{photo:""}))
            });
          }
          return raw;'''
          new = '''  // Keep photos on active events. The old 90 KB fallback erased them before publishing.
          const trash=(TRASH||[]).slice(0,200).map(ev=>Object.assign({},ev,{photo:""}));
          return JSON.stringify({updated:new Date().toISOString(),events,trash});'''
          if old not in s:
              raise SystemExit('Target block not found; no changes made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raspisanie-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix attached photos being dropped"
          git push
