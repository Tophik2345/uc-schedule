name: Fix cancellation notice
on:
  push:
    paths: ['.github/workflows/fix-cancel-notice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cancellation behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('raspisanie-admin.html')
          s=p.read_text(encoding='utf-8')
          old='async function dsNotice(text){try{const h=dsHook();if(h)await fetch(h,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:text,allowed_mentions:{parse:[]}})})}catch(e){}}'
          new='async function dsNotice(text,autoDeleteMs=0){try{const h=dsHook();if(!h)return;const r=await fetch(h+"?wait=true",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:text,allowed_mentions:{parse:[]}})});if(!r.ok)return;const m=await r.json();if(autoDeleteMs&&m&&m.id)setTimeout(()=>fetch(h+"/messages/"+m.id,{method:"DELETE"}).catch(()=>{}),autoDeleteMs)}catch(e){}}'
          if old not in s: raise SystemExit('dsNotice target not found')
          s=s.replace(old,new,1)
          old2='const reason=prompt("Причина отмены:","");if(reason===null)return;ev.cancelled=true;ev.cancelReason=reason.trim();audit(ev,"Отмена",ev.cancelReason);save();render();if(ev.dsId)await delDiscord(ev.dsId);await dsNotice("**Занятие отменено · "+(ev.title||"УЦ")+"**\\nДата: "+ev.date+" · "+(ev.start||ev.gather)+"\\nПричина: "+(ev.cancelReason||"не указана"));publish().catch(()=>{})'
          new2='const reason=prompt("Причина отмены:","");if(reason===null)return;const cleanReason=reason.trim();ev.cancelled=true;ev.cancelReason=cleanReason;audit(ev,"Отмена",cleanReason);save();render();if(ev.dsId)await delDiscord(ev.dsId);if(cleanReason)await dsNotice("**Занятие отменено · "+(ev.title||"УЦ")+"**\\nДата: "+ev.date+" · "+(ev.start||ev.gather)+"\\nПричина: "+cleanReason,300000);publish().catch(()=>{})'
          if old2 not in s: raise SystemExit('cancel target not found')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raspisanie-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide empty cancellation notices and auto-delete them"
          git push