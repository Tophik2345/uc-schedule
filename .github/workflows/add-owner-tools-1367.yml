name: Add owner tools 1 3 4 5 6 7
on:
  push:
    paths: ['.github/workflows/add-owner-tools-1367.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch owner tools
        shell: python
        run: |
          from pathlib import Path
          p=Path('raspisanie-owner.html'); s=p.read_text(encoding='utf-8')
          css='''\n  .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.tools input,.tools select{width:100%;background:#121516;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px}.scroll{max-height:360px;overflow:auto}.click{cursor:pointer}\n'''
          s=s.replace('</style>',css+'</style>',1)
          marker='<div class="panel">\n    <h2>Корзина занятий</h2>'
          panels='''<div class="panel">\n    <h2>Занятия и поиск</h2>\n    <div class="tools"><input id="evSearch" placeholder="Название, место, инструктор"><input id="evDate" type="date"><select id="evStatus"><option value="">Все статусы</option><option value="active">Предстоящие</option><option value="cancelled">Отменённые</option><option value="done">Завершённые</option></select></div>\n    <div id="eventList" class="scroll"></div>\n  </div>\n  <div class="panel"><h2>Журнал действий</h2><div id="auditList" class="scroll hint">Загружаю…</div></div>\n  <div class="panel"><h2>Отменённые занятия</h2><div id="cancelList" class="scroll"></div></div>\n  <div class="panel"><h2>Discord</h2><p class="hint" id="discordDetail">Загружаю состояние…</p><button type="button" class="ghost" id="discordRefresh">Обновить состояние</button></div>\n  <div class="panel"><h2>Резервная копия</h2><p class="hint">Скачать текущие данные расписания и пользователей в один JSON-файл.</p><div class="acts"><button type="button" class="ghost" id="backupDownload">Скачать копию</button></div></div>\n  '''
          if marker not in s: raise SystemExit('marker not found')
          s=s.replace(marker,panels+marker,1)
          js=r'''\nlet OWNER_EVENTS=[], OWNER_TRASH=[];\nfunction evTime(e){return String(e.date||"")+" "+String(e.start||e.gather||"")}\nasync function loadOwnerEvents(){\n  try{const r=await fetch("https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/main/schedule.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("schedule.json недоступен");const j=await r.json();OWNER_EVENTS=Array.isArray(j.events)?j.events:[];OWNER_TRASH=Array.isArray(j.trash)?j.trash:[];drawOwnerEvents();drawAudit();drawCancelled()}catch(e){document.getElementById("eventList").textContent=e.message}\n}\nfunction filteredEvents(){const q=(document.getElementById("evSearch").value||"").toLowerCase(),d=document.getElementById("evDate").value,st=document.getElementById("evStatus").value;return OWNER_EVENTS.filter(e=>{const hay=[e.title,e.place,e.instructor,e.note].join(" ").toLowerCase();if(q&&!hay.includes(q))return false;if(d&&e.date!==d)return false;if(st==="cancelled"&&!e.cancelled)return false;if(st==="done"&&!e.done)return false;if(st==="active"&&(e.done||e.cancelled))return false;return true}).sort((a,b)=>evTime(a).localeCompare(evTime(b)))}\nfunction drawOwnerEvents(){const box=document.getElementById("eventList"),a=filteredEvents();box.innerHTML=a.length?a.slice(0,150).map(e=>`<div class="row"><div><b>${esc(e.title||"Занятие")}</b><div class="meta">${esc(evTime(e))} · ${esc(e.place||"—")}</div><div class="meta">${esc(e.instructor||"—")} · ${e.cancelled?"ОТМЕНЕНО":e.done?"ЗАВЕРШЕНО":"активно"}</div></div></div>`).join(""):"<p class='hint'>Ничего не найдено.</p>"}\nfunction drawAudit(){let rows=[];OWNER_EVENTS.concat(OWNER_TRASH).forEach(e=>(Array.isArray(e.history)?e.history:[]).forEach(h=>rows.push({e,h})));rows.sort((a,b)=>String(b.h.at||"").localeCompare(String(a.h.at||"")));document.getElementById("auditList").innerHTML=rows.length?rows.slice(0,200).map(x=>`<div class="row"><div><b>${esc(x.h.action||"Действие")}</b> · ${esc(x.e.title||"Занятие")}<div class="meta">${when(x.h.at)} · ${esc(x.h.by||"—")}${x.h.details?" · "+esc(x.h.details):""}</div></div></div>`).join(""):"История пока пустая."}\nfunction drawCancelled(){const a=OWNER_EVENTS.filter(e=>e.cancelled);document.getElementById("cancelList").innerHTML=a.length?a.map(e=>`<div class="row"><div><b>${esc(e.title||"Занятие")}</b><div class="meta">${esc(evTime(e))} · ${esc(e.instructor||"—")}</div><div class="meta">Причина: ${esc(e.cancelReason||"—")}</div></div></div>`).join(""):"<p class='hint'>Отменённых занятий нет.</p>"}\nasync function loadDiscordDetail(){try{const r=await fetch("https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/main/ds_pings.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("ds_pings.json недоступен");const d=await r.json(),dt=d.checked?new Date(d.checked):null;document.getElementById("discordDetail").textContent="Последняя проверка: "+(dt?dt.toLocaleString("ru-RU"):"—")+" · отправлено: "+Number(d.posted||0)+" · удалено: "+Number(d.deleted||0)+" · ошибок: "+Number(d.errors||0)+" · обработано занятий: "+Number(d.events||0)}catch(e){document.getElementById("discordDetail").textContent="Discord: "+e.message}}\nasync function downloadBackup(){try{const [s,u]=await Promise.all([fetch("https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/main/schedule.json?t="+Date.now(),{cache:"no-store"}),fetch("https://raw.githubusercontent.com/"+GH.owner+"/"+GH.repo+"/main/users.json?t="+Date.now(),{cache:"no-store"})]);if(!s.ok||!u.ok)throw Error("Не удалось загрузить данные");const data={created:new Date().toISOString(),schedule:await s.json(),users:await u.json()},blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="uc-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert("Резервная копия: "+e.message)}}\nfunction showInstructor(login){const u=LIST.find(x=>x.login===login),name=u?((u.last||"")+" "+(u.first||"")).trim():login,q=(name||login||"").toLowerCase(),a=OWNER_EVENTS.filter(e=>String(e.instructor||"").toLowerCase().includes(q)||String(e.createdBy||"").toLowerCase()===String(login||"").toLowerCase()),cancel=a.filter(e=>e.cancelled).length,done=a.filter(e=>e.done).length;alert((name||login)+"\\nВсего занятий: "+a.length+"\\nЗавершено: "+done+"\\nОтменено: "+cancel+"\\nАктивных: "+(a.length-done-cancel))}\n'''
          s=s.replace('async function loadUsers(){',js+'\nasync function loadUsers(){',1)
          s=s.replace('        <b>${esc((u.last||"")+" "+(u.first||""))}</b>','        <b class="click" data-profile="${esc(u.login)}">${esc((u.last||"")+" "+(u.first||""))}</b>',1)
          s=s.replace('  box.querySelectorAll("button[data-on]").forEach', '  box.querySelectorAll("[data-profile]").forEach(x=>x.onclick=()=>showInstructor(x.dataset.profile));\n  box.querySelectorAll("button[data-on]").forEach',1)
          s=s.replace('  loadDashboard();','  loadDashboard();\n  loadOwnerEvents();\n  loadDiscordDetail();',1)
          s=s.replace('</script>','''\ndocument.getElementById("evSearch").addEventListener("input",drawOwnerEvents);\ndocument.getElementById("evDate").addEventListener("change",drawOwnerEvents);\ndocument.getElementById("evStatus").addEventListener("change",drawOwnerEvents);\ndocument.getElementById("discordRefresh").onclick=loadDiscordDetail;\ndocument.getElementById("backupDownload").onclick=downloadBackup;\n</script>''',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raspisanie-owner.html
          git diff --cached --quiet && exit 0
          git commit -m "Add owner audit instructor Discord filters cancellation and backup tools"
          git push